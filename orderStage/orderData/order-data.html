<!DOCTYPE html>
<html lang="ar" dir="rtl" id="order_html">

<head id="order_head">
    
  <script src="/LocalDatabasesProject/local-db.js"></script>
  <script src="/js/early-error-bootstrap.js"></script>
    <meta charset="UTF-8" id="order_meta_charset">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        id="order_meta_viewport">
    <title id="order_title_tag">تفاصيل الطلب - Suez Bazaar</title>

    <!-- Core Loader (Loads global CSS and JS) -->
    <script id="order-script-behavior" src="/js/app-behavior.js"></script>
    <script id="order-script-loader" src="/js/core-loader-bootstrap.js"></script>

    <!-- Page Specific Styles (Keep these as they are not global) -->
    <link rel="stylesheet" href="/orderStage/orderData/parts/common.css" id="order_css_common">
    <link rel="stylesheet" href="/orderStage/orderData/parts/navigation.css" id="order_css_nav">
</head>

<body id="order_body">

    <!-- Header Injection Point -->
    <div id="header-injection-point" class="order_header_injection"></div>

    <div id="order_page_wrapper" class="order_page_wrapper">
        <!-- Navigation / Badge Container -->
        <div id="order_nav_container" class="order_nav_bar" style="display: none; margin-top: 20px;"></div>

        <!-- Section 1: Products View (Publicly visible to all roles) -->
        <div id="order_role_products" class="order_role_section" style="display: none;">
            <div id="order_title_products" class="order_section_title">
                <i id="order_icon_products" class="fas fa-boxes"></i> لوحة الخدمات
            </div>
            <div id="order_content_products" class="order_role_content">جاري التحميل...</div>
        </div>

        <!-- Section 2: Buyer View -->
        <div id="order_role_buyer" class="order_role_section" style="display: none;">
            <div id="order_title_buyer" class="order_section_title">
                <i id="order_icon_buyer" class="fas fa-shopping-bag"></i> لوحة المشتري
            </div>
            <div id="order_content_buyer" class="order_role_content">جاري التحميل...</div>
        </div>

        <!-- Section 3: Merchant View -->
        <div id="order_role_commercial" class="order_role_section" style="display: none;">
            <div id="order_title_commercial" class="order_section_title">
                <i id="order_icon_commercial" class="fas fa-store"></i> لوحة مقدم الخدمة
            </div>
            <div id="order_content_commercial" class="order_role_content">جاري التحميل...</div>
        </div>

        <!-- Section 4: Delivery View -->
        <div id="order_role_delivery" class="order_role_section" style="display: none;">
            <div id="order_title_delivery" class="order_section_title">
                <i id="order_icon_delivery" class="fas fa-truck"></i> مهام التوصيل
            </div>
            <div id="order_content_delivery" class="order_role_content">جاري التحميل...</div>
        </div>

        <!-- Section 5: Super Admin Exclusive -->
        <div id="order_admaindata" class="order_container" style="display: none;">
            <div id="order_loading_msg" class="order_loading">جاري تحميل البيانات الشاملة...</div>
        </div>

    </div>

    <!-- Scripts: Components First (Not in global loader) -->
    <script id="order_script_nav" src="/orderStage/orderData/parts/navigation.js" defer></script>

    <!-- Shared Modules (Page Specific) -->
    <script id="order_script_parser" src="/orderStage/orderData/js/status-parser.js" defer></script>
    <script id="order_script_ui_helpers" src="/orderStage/orderData/js/ui-helpers.js" defer></script>
    <script id="order_script_stepper" src="/orderStage/orderData/js/stepper.js" defer></script>
    <script id="order_script_item_actions" src="/orderStage/orderData/js/item-actions.js" defer></script>

    <!-- Role Parts -->
    <script id="order_script_buyer_delivery" src="/orderStage/orderData/parts/buyer-partials/delivery-info.js"
        defer></script>
    <script id="order_script_buyer_workflow" src="/orderStage/orderData/parts/buyer-partials/workflow.js"
        defer></script>
    <script id="order_script_buyer" src="/orderStage/orderData/parts/buyer.js" defer></script>

    <script id="order_script_commercial_summary" src="/orderStage/orderData/parts/commercial-partials/summary.js"
        defer></script>
    <script id="order_script_commercial_actions" src="/orderStage/orderData/parts/commercial-partials/actions.js"
        defer></script>
    <script id="order_script_commercial" src="/orderStage/orderData/parts/commercial.js" defer></script>

    <script id="order_script_delivery_destination" src="/orderStage/orderData/parts/delivery-partials/destination.js"
        defer></script>
    <script id="order_script_delivery_pickups" src="/orderStage/orderData/parts/delivery-partials/pickups.js"
        defer></script>
    <script id="order_script_delivery_workflow" src="/orderStage/orderData/parts/delivery-partials/workflow.js"
        defer></script>
    <script id="order_script_delivery" src="/orderStage/orderData/parts/delivery.js" defer></script>

    <script id="order_script_products" src="/orderStage/orderData/parts/products.js" defer></script>

    <!-- Admin Partials -->
    <script id="order_script_admin_header" src="/orderStage/orderData/parts/admin-partials/header.js" defer></script>
    <script id="order_script_admin_buyer_info" src="/orderStage/orderData/parts/admin-partials/buyer-info.js"
        defer></script>
    <script id="order_script_admin_items_list" src="/orderStage/orderData/parts/admin-partials/items-list.js"
        defer></script>
    <script id="order_script_admin_grid_info" src="/orderStage/orderData/parts/admin-partials/grid-info.js"
        defer></script>
    <script id="order_script_admin_permissions" src="/orderStage/orderData/parts/admin-partials/permissions.js"
        defer></script>
    <script id="order_script_admin_workflow_table"
        src="/orderStage/orderData/parts/admin-partials/workflow-guide-table.js" defer></script>
    <script id="order_script_admin_workflow_comparison"
        src="/orderStage/orderData/parts/admin-partials/workflow-guide-comparison.js" defer></script>
    <script id="order_script_admin_workflow" src="/orderStage/orderData/parts/admin-partials/workflow-guide-main.js"
        defer></script>
    <script id="order_script_admin_delivery_assignment"
        src="/orderStage/orderData/parts/admin-partials/delivery-assignment.js" defer></script>
    <script id="order_script_admin_raw_data" src="/orderStage/orderData/parts/admin-partials/raw-data.js"
        defer></script>
    <script id="order_script_admin_master" src="/orderStage/orderData/parts/admin.js" defer></script>

    <!-- Main Orchestration -->
    <script id="order_script_roles" src="/orderStage/orderData/js/role-manager.js" defer></script>
    <script id="order_script_loader" src="/orderStage/orderData/js/main-loader.js" defer></script>

    <script id="order_page_init">
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                // 1. Theme Init
                if (typeof initAppTheme === 'function') initAppTheme();

                // 2. Initialize Translations (CRITICAL: Load before session and header)
                if (typeof loadIndexTranslations === 'function') {
                    await window.loadIndexTranslations();
                }

                // 3. Initialize Session (Syncs UI, using modern UserService via SessionManager)
                if (typeof SessionManager !== 'undefined') {
                    SessionManager.init();
                }

                // 4. Initialize Header (Depends on translations)
                if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                    await AppHeader.init('header-injection-point', 'index-sales-movement-btn');
                }

                // 5. Apply Translations to Page
                if (window.applyAppTranslations) window.applyAppTranslations();

            } catch (error) {
                console.error('[OrderData] Page initialization failed:', error);
            }
        });
    </script>
</body>

</html>
