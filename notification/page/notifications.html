<!DOCTYPE html>
<html id="index-html-root" lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>الإشعارات - Suez Bazaar</title>

    <!-- Core Loader -->
    <script src="/js/core-loader.js"></script>

    <!-- Page Styles -->




</head>

<body style="background-color: var(--bg-color-light);">
   

    <!-- Header Container -->
    <div id="header-injection-point"></div>

    <!-- الحاوية الرئيسية -->
    <div class="notifications-container" id="notifications-container">
        <!-- قائمة الإشعارات -->
        <main class="notifications-list" id="notifications-list">
            <!-- سيتم ملء الإشعارات هنا بواسطة JavaScript -->
        </main>

        <!-- حالات الصفحة -->
        <div class="state-container" id="loading-state">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <h3 data-lkey="notifications_loading">جاري تحميل الإشعارات...</h3>
            </div>
        </div>

        <div class="state-container" id="empty-state">
            <div class="empty-state">
                <i class="far fa-bell-slash"></i>
                <h3 data-lkey="notifications_empty_title">لا توجد إشعارات حتى الآن</h3>
                <p data-lkey="notifications_empty_desc">سيظهر هنا أي إشعارات تصل إليك</p>
            </div>
        </div>

        <div class="state-container" id="error-state">
            <div class="error-state">
                <i class="fas fa-exclamation-triangle"></i>
                <h3 data-lkey="notifications_error_title">حدث خطأ أثناء تحميل الإشعارات</h3>
                <p class="error-message" data-lkey="notifications_error_desc">فشل في تحميل الإشعارات. تأكد من اتصالك
                    بالإنترنت.</p>
                <button class="btn btn-primary" onclick="window.location.reload()">
                    <i class="fas fa-redo"></i> <span data-lkey="notifications_retry_btn">إعادة المحاولة</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            // 1. Initialize Theme
            if (typeof initAppTheme === 'function') initAppTheme();

            // 2. Initialize Translations (CRITICAL: Load before session and header)
            if (typeof loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            // 3. Initialize Session (Syncs UI, depends on translations)
            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
            }

            // 4. Initialize Header (Depends on translations)
            if (typeof AppHeader !== 'undefined') {
                await AppHeader.init('header-injection-point', 'index-notifications-btn');
            }

            // 5. Apply Translations to Page
            if (typeof applyAppTranslations === 'function') {
                applyAppTranslations();
            }

            // 5. Initialize Page Logic
            if (typeof NotificationPage !== 'undefined' && typeof NotificationPage.init === 'function') {
                NotificationPage.init();
            }

            // 6. Hide Splash Screen
            setTimeout(() => {
                if (typeof window.hideSplashScreen === 'function') {
                    window.hideSplashScreen();
                }
            }, 300);
        });
    </script>
</body>

</html>
