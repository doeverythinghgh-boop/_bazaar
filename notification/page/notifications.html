<!DOCTYPE html><html id="index-html-root" lang="ar" dir="rtl"><head id="notifications-head"><meta id="notifications-meta-charset" charset="UTF-8"><meta id="notifications-meta-viewport" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title id="notifications-page-title">الإشعارات - Suez Bazaar</title><script id="notifications-core-loader" src="/js/core-loader-bootstrap.js"></script></head><body id="notifications-page-body" style="background-color:var(--bg-color-light)"><div id="header-injection-point"></div><main class="notifications-list" id="notifications-list"></main><div class="state-container" id="loading-state"><div class="loading-state" id="notifications-loading-wrapper"><i id="notifications-loading-icon" class="fas fa-spinner fa-spin"></i><h3 id="notifications-loading-text" data-lkey="notifications_loading">جاري تحميل الإشعارات...</h3></div></div><div class="state-container" id="empty-state"><div class="empty-state" id="notifications-empty-wrapper"><i id="notifications-empty-icon" class="far fa-bell-slash"></i><h3 id="notifications-empty-title" data-lkey="notifications_empty_title">لا توجد إشعارات حتى الآن</h3><p id="notifications-empty-desc" data-lkey="notifications_empty_desc">سيظهر هنا أي إشعارات تصل إليك</p></div></div><div class="state-container" id="error-state"><div class="error-state" id="notifications-error-wrapper"><i id="notifications-error-icon" class="fas fa-exclamation-triangle"></i><h3 id="notifications-error-title" data-lkey="notifications_error_title">حدث خطأ أثناء تحميل الإشعارات</h3><p id="notifications-error-message" class="error-message" data-lkey="notifications_error_desc">فشل في تحميل الإشعارات. تأكد من اتصالك بالإنترنت.</p><button id="notifications-retry-button" class="btn btn-primary" onclick="window.location.reload()"><i id="notifications-retry-icon" class="fas fa-redo"></i> <span id="notifications-retry-text" data-lkey="notifications_retry_btn">إعادة المحاولة</span></button></div></div><script id="notifications-bootstrap-script">document.addEventListener('DOMContentLoaded', async function () {
            if (typeof initAppTheme === 'function') initAppTheme();

            if (typeof loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
            }

            if (typeof AppHeader !== 'undefined') {
                await AppHeader.init('header-injection-point', 'index-notifications-btn');
            }

            if (typeof applyAppTranslations === 'function') {
                applyAppTranslations();
            }

            if (typeof NotificationPage !== 'undefined' && typeof NotificationPage.init === 'function') {
                NotificationPage.init();
            }

            setTimeout(() => {
                if (typeof window.hideSplashScreen === 'function') {
                    window.hideSplashScreen();
                }
            }, 300);
        });</script></body></html>
