<!DOCTYPE html><html lang="ar" dir="rtl" id="html-root"><head id="head-section"><meta charset="UTF-8" id="meta-charset"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" id="meta-viewport"><title id="page-title">Suez Bazaar - Car Selector</title><script src="/js/app-behavior.js" id="script-behavior"></script><script src="/js/core-loader-bootstrap.js" id="script-bootstrap"></script><style id="custom-styles">:root{--card-padding:12px}body{font-family:var(--font-primary),sans-serif;background-color:var(--bg-color-light);color:var(--text-color-dark);padding-bottom:120px;margin:0}.container{width:100%;margin:0;padding:10px 15px;box-sizing:border-box}.category-section{margin-bottom:10px;background:var(--bg-color-white);padding:10px;border-radius:12px;box-shadow:var(--shadow-soft);border:1px solid var(--border-color-soft)}.category-title{font-size:1rem;font-weight:700;margin-bottom:10px;color:var(--dark-blue);border-bottom:2px solid var(--primary-color-light);padding-bottom:5px}.items-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-height:400px;overflow-y:auto;padding-right:5px;scrollbar-width:thin;scrollbar-color:var(--primary-color) transparent}.items-grid::-webkit-scrollbar{width:4px}.items-grid::-webkit-scrollbar-thumb{background-color:var(--primary-color);border-radius:10px}.item-card{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:8px 4px;border:1px solid var(--border-color);border-radius:12px;background:var(--bg-color-white);cursor:pointer;transition:all .2s ease;gap:5px;text-align:center;min-height:100px}@media (min-width:600px){.items-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));max-height:450px}}.item-card.selected{border-color:var(--primary-color);background-color:var(--primary-color-light);box-shadow:var(--shadow-interactive)}.item-card img{width:40px;height:40px;object-fit:contain;flex-shrink:0}.item-card input[type=radio]{width:12px;height:12px;cursor:pointer;accent-color:var(--primary-color);flex-shrink:0;margin:0}.item-name{font-size:.65rem;font-weight:600;color:var(--text-color-dark);width:100%;word-break:break-word;line-height:1.2}.fuel-card{flex-direction:row!important;min-height:auto!important;padding:5px 10px!important;width:fit-content;justify-self:start;gap:8px!important}.fuel-name{text-align:right;white-space:nowrap;width:auto!important}.tight-card{padding:4px 2px!important;gap:2px!important;min-height:80px!important}.tight-grid{max-height:220px!important}@media (min-width:600px){.tight-grid{max-height:260px!important}}.result-footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg-color-glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:15px 20px;border-top:1px solid var(--border-color);z-index:1000;box-shadow:0 -4px 12px rgba(0,0,0,.05)}.result-content{width:100%;margin:0;display:flex;align-items:center;gap:15px}.ids-display{background:var(--text-color-dark);color:var(--primary-color);padding:10px 15px;border-radius:8px;font-family:monospace;flex-grow:1;font-size:1rem;min-height:40px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}.id-tag{background:rgba(var(--primary-rgb),.2);padding:2px 6px;border-radius:4px;border:1px solid var(--primary-color)}</style></head><body id="body-root"><div class="container" id="main-container"></div><footer class="result-footer" id="footer"><div class="result-content" id="footer-content"><span id="footer-label" style="font-weight:700;white-space:nowrap"></span><div class="ids-display" id="selected-ids"></div></div></footer><script id="main-logic">const categories = [
            { id: 'brands', title_ar: 'ماركة السيارة', title_en: 'Car Brand', file: 'brands.json' },
            { id: 'body_types', title_ar: 'نوع الهيكل', title_en: 'Body Style', file: 'body_types.json' },
            { id: 'fuel_types', title_ar: 'نوع الوقود', title_en: 'Fuel Type', file: 'fuel_types.json' },
            { id: 'transmission_types', title_ar: 'ناقل الحركة', title_en: 'Transmission', file: 'transmission_types.json' },
            { id: 'car_conditions', title_ar: 'حالة السيارة', title_en: 'Car Condition', file: 'car_conditions.json' },
            { id: 'special_types', title_ar: 'تصنيفات خاصة', title_en: 'Special Types', file: 'special_types.json' }
        ];

        const selections = {};

        async function loadData() {
            const isAr = window.app_language === 'ar';
            document.getElementById('footer-label').innerText = isAr ? 'المعرفات:' : 'IDs:';
            document.getElementById('selected-ids').innerText = isAr ? 'في انتظار الاختيار...' : 'Waiting for selection...';

            for (const cat of categories) {
                try {
                    const response = await fetch(cat.file);
                    const data = await response.json();
                    renderCategory(cat, data);
                } catch (error) {
                    console.error(`Error loading ${cat.file}:`, error);
                }
            }
        }

        function renderCategory(cat, data) {
            const mainContainer = document.getElementById('main-container');
            const isAr = window.app_language === 'ar';
            const compactIds = ['fuel_types', 'transmission_types', 'car_conditions', 'special_types'];
            const isCompact = compactIds.includes(cat.id);
            
            const section = document.createElement('div');
            section.className = 'category-section';
            section.id = `cat-section-${cat.id}`;
            
            const title = document.createElement('h2');
            title.className = 'category-title';
            title.id = `cat-title-${cat.id}`;
            title.innerText = isAr ? cat.title_ar : cat.title_en;
            section.appendChild(title);
            
            const grid = document.createElement('div');
            grid.className = (cat.id === 'brands' || cat.id === 'body_types') ? 'items-grid tight-grid' : 'items-grid';
            grid.id = `grid-${cat.id}`;
            
            data.forEach(item => {
                const card = document.createElement('label');
                let cardClass = 'item-card';
                if (isCompact) cardClass += ' fuel-card';
                if (cat.id === 'brands' || cat.id === 'body_types') cardClass += ' tight-card';
                
                card.className = cardClass;
                card.id = `card-${cat.id}-${item.id}`;
                card.dataset.catId = cat.id;
                
                // 1. Image (Skip for compact types)
                if (item.image && !isCompact) {
                    const img = document.createElement('img');
                    img.id = `img-${cat.id}-${item.id}`;
                    img.src = item.image;
                    img.alt = isAr ? (item.name_ar || item.name) : item.name;
                    img.onerror = () => img.style.display = 'none';
                    card.appendChild(img);
                }
                
                // 2. Radio Button (Visible)
                const radio = document.createElement('input');
                radio.id = `radio-${cat.id}-${item.id}`;
                radio.type = 'radio';
                radio.name = cat.id;
                radio.value = item.id;
                radio.onchange = () => handleSelection(cat.id, item.id, card);
                card.appendChild(radio);
                
                // 3. Arabic/English Text
                const name = document.createElement('span');
                name.className = isCompact ? 'item-name fuel-name' : 'item-name';
                name.id = `name-${cat.id}-${item.id}`;
                name.innerText = isAr ? (item.name_ar || item.name) : item.name;
                card.appendChild(name);
                
                grid.appendChild(card);
            });
            
            section.appendChild(grid);
            mainContainer.appendChild(section);
        }

        function handleSelection(catId, itemId, selectedCard) {
            const cards = document.querySelectorAll(`.item-card[data-cat-id="${catId}"]`);
            cards.forEach(c => c.classList.remove('selected'));
            selectedCard.classList.add('selected');
            
            selections[catId] = itemId;
            updateDisplay();
        }

        function updateDisplay() {
            const display = document.getElementById('selected-ids');
            const selectedIds = Object.values(selections);
            const isAr = window.app_language === 'ar';
            
            if (selectedIds.length === 0) {
                display.innerText = isAr ? 'في انتظار الاختيار...' : 'Waiting for selection...';
                return;
            }
            
            display.innerHTML = '';
            selectedIds.forEach(id => {
                const tag = document.createElement('span');
                tag.className = 'id-tag';
                tag.id = `tag-id-${id}`;
                tag.innerText = id;
                display.appendChild(tag);
            });
        }

        // Initialize when ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadData);
        } else {
            loadData();
        }</script></body></html>
