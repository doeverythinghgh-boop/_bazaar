<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bazaar - Admin Hub</title><link rel="stylesheet" href="/style/variables.css"><link rel="stylesheet" href="/style/index.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>:root{--hub-header-bg:#ffffff;--hub-btn-bg:#f8f9fa;--hub-btn-hover:#e9ecef;--hub-accent:var(--primary-color, #007bff)}body.dark-theme :root{--hub-header-bg:#212529;--hub-btn-bg:#343a40;--hub-btn-hover:#495057}body{margin:0;padding:0;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-color)}.hub-header{background:var(--hub-header-bg);padding:10px 15px;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;gap:10px;z-index:100;overflow-x:auto;white-space:nowrap}.hub-header::-webkit-scrollbar{display:none}.hub-header{-ms-overflow-style:none;scrollbar-width:none}.hub-btn{padding:8px 16px;border:none;border-radius:8px;background:var(--hub-btn-bg);color:var(--text-color);font-size:.9em;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;font-weight:500}.hub-btn.active{background:var(--hub-accent);color:#fff}.hub-btn i{font-size:1.1em}.hub-btn-danger{background:#dc3545;color:#fff;margin-right:auto}.back-btn{background:#6c757d;color:#fff;padding:8px 12px}.iframe-container{flex-grow:1;position:relative;background:#f1f1f1}body.dark-theme .iframe-container{background:#121212}iframe{width:100%;height:100%;border:none;position:absolute;top:0;left:0}.loader-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg-color);display:flex;justify-content:center;align-items:center;z-index:50;display:none}.loader{width:40px;height:40px;border:4px solid var(--hub-btn-bg);border-top:4px solid var(--hub-accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}</style></head><body><header class="hub-header" id="hub-main-header"><button class="hub-btn back-btn" id="btn-back-home" onclick="window.location.href='../../index.html'"><i class="fas fa-arrow-right" id="icon-back"></i></button> <button class="hub-btn active" id="btn-nav-users" data-url="adminPanel.html"><i class="fas fa-users" id="icon-users"></i> <span id="label-nav-users" data-lkey="dash_btn_users">الأعضاء</span></button> <button class="hub-btn" id="btn-nav-ads" data-url="mainAdvertises.html"><i class="fas fa-ad" id="icon-ads"></i> <span id="label-nav-ads" data-lkey="dash_btn_advert">الإعلانات</span></button> <button class="hub-btn" id="btn-nav-pending" data-url="pendingProducts.html"><i class="fas fa-hourglass-half" id="icon-pending"></i> <span id="label-nav-pending" data-lkey="dash_btn_pending_products">منتجات معلقة</span></button> <button class="hub-btn" id="btn-nav-analyzer" data-url="imageAnalyzer.html"><i class="fas fa-images" id="icon-analyzer"></i> <span id="label-nav-analyzer" data-lkey="dash_btn_image_analyzer">مدير الصور</span></button> <button class="hub-btn hub-btn-danger" id="factory-reset-btn"><i class="fas fa-trash-alt" id="icon-reset"></i> <span id="label-nav-reset" data-lkey="dash_btn_factory_reset">مسح كلي</span></button></header><main class="iframe-container" id="hub-main-content"><div class="loader-overlay" id="loader-overlay-container"><div class="loader" id="loader-spinner"></div></div><iframe id="hub-iframe" src="adminPanel.html"></iframe></main><script src="/js/runtime-config.js"></script><script src="/js/config-runtime.js"></script><script src="/js/config-specialty.js"></script><script src="/js/config-roles.js"></script><script src="/js/globalVariable.js"></script><script src="/js/app-i18n.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script>if (localStorage.getItem('app_theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }

        async function initAdminHubTranslations() {
            if (typeof window.loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
                if (typeof window.applyAppTranslations === 'function') {
                    window.applyAppTranslations();
                }
            }
        }
        initAdminHubTranslations();

        function applyAdminRestrictions() {
            try {
                const userStr = localStorage.getItem("loggedInUser");
                const user = userStr ? JSON.parse(userStr) : null;
                const capabilities = typeof window.resolveUserCapabilities === 'function'
                    ? window.resolveUserCapabilities(user)
                    : null;
                const isSuper = !!capabilities?.isSuperAdmin;

                if (!isSuper) {
                    const analyzerBtn = document.getElementById('btn-nav-analyzer');
                    const resetBtn = document.getElementById('factory-reset-btn');
                    if (analyzerBtn) analyzerBtn.style.display = 'none';
                    if (resetBtn) resetBtn.style.display = 'none';
                }
            } catch (e) {
                console.error("[AdminHub] Auth check failed", e);
            }
        }
        applyAdminRestrictions();

        const iframe = document.getElementById('hub-iframe');
        const loader = document.getElementById('loader-overlay-container');
        const buttons = document.querySelectorAll('.hub-btn[data-url]');

        buttons.forEach((btn) => {
            btn.addEventListener('click', () => {
                const url = btn.getAttribute('data-url');
                buttons.forEach((button) => button.classList.remove('active'));
                btn.classList.add('active');
                showLoader();
                iframe.src = url;
            });
        });

        function showLoader() {
            if (loader) loader.style.display = 'flex';
        }

        function hideLoader() {
            if (loader) loader.style.display = 'none';
        }

        iframe.onload = () => {
            hideLoader();
        };

        document.getElementById('factory-reset-btn').addEventListener('click', () => {
            const title = window.langu ? window.langu("factory_reset_confirm.title") : "هل أنت متأكد؟";
            const text = window.langu ? window.langu("factory_reset_confirm.text") : "سيتم مسح كافة البيانات تمامًا، لا يمكن التراجع!";
            const confirmText = window.langu ? window.langu("factory_reset_confirm.confirm_btn") : "نعم، امسح الكل";
            const cancelText = window.langu ? window.langu("alert_cancel_btn") : "إلغاء";
            const loadingTitle = window.langu ? window.langu("updating") : "جاري المسح...";

            Swal.fire({
                title: title,
                text: text,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                customClass: {
                    popup: 'swal-modern-popup'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: loadingTitle,
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    if (typeof window.appHardReset === 'function') {
                        window.appHardReset();
                    } else {
                        localStorage.clear();
                        window.location.href = '../../index.html';
                    }
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            // Restrictions and themes are handled immediately above
        });</script></body></html>
