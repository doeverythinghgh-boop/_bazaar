<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bazaar - Admin Hub</title><link rel="stylesheet" href="/style/variables.css"><link rel="stylesheet" href="/style/index.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>:root{--hub-header-bg:#ffffff;--hub-btn-bg:#f8f9fa;--hub-btn-hover:#e9ecef;--hub-accent:var(--primary-color, #007bff)}body.dark-theme :root{--hub-header-bg:#212529;--hub-btn-bg:#343a40;--hub-btn-hover:#495057}body{margin:0;padding:0;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-color)}.hub-header{background:var(--hub-header-bg);padding:10px 15px;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;gap:10px;z-index:100;overflow-x:auto;white-space:nowrap}.hub-header::-webkit-scrollbar{display:none}.hub-header{-ms-overflow-style:none;scrollbar-width:none}.hub-btn{padding:8px 16px;border:none;border-radius:8px;background:var(--hub-btn-bg);color:var(--text-color);font-size:.9em;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;font-weight:500}.hub-btn:hover{background:var(--hub-btn-hover);transform:translateY(-1px)}.hub-btn.active{background:var(--hub-accent);color:#fff}.hub-btn i{font-size:1.1em}.hub-btn-danger{background:#dc3545;color:#fff;margin-right:auto}.hub-btn-danger:hover{background:#c82333}.back-btn{background:#6c757d;color:#fff;padding:8px 12px}.iframe-container{flex-grow:1;position:relative;background:#f1f1f1}body.dark-theme .iframe-container{background:#121212}iframe{width:100%;height:100%;border:none;position:absolute;top:0;left:0}.loader-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg-color);display:flex;justify-content:center;align-items:center;z-index:50;display:none}.loader{width:40px;height:40px;border:4px solid var(--hub-btn-bg);border-top:4px solid var(--hub-accent);border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}</style></head><body><header class="hub-header"><button class="hub-btn back-btn" onclick="window.location.href='../../index.html'"><i class="fas fa-arrow-right"></i></button> <button class="hub-btn active" data-url="adminPanel.html"><i class="fas fa-users"></i> <span data-lkey="dash_btn_users">الأعضاء</span></button> <button class="hub-btn" data-url="mainAdvertises.html"><i class="fas fa-ad"></i> <span data-lkey="dash_btn_advert">الإعلانات</span></button> <button class="hub-btn" data-url="../../notification/page/admainNotificationsetting.html"><i class="fas fa-bell"></i> <span data-lkey="dash_btn_notifications">الإشعارات</span></button> <button class="hub-btn" data-url="pendingProducts.html"><i class="fas fa-hourglass-half"></i> <span data-lkey="dash_btn_pending_products">منتجات معلقة</span></button> <button class="hub-btn" data-url="imageAnalyzer.html"><i class="fas fa-images"></i> <span>مدير الصور</span></button> <button class="hub-btn hub-btn-danger" id="factory-reset-btn"><i class="fas fa-trash-alt"></i> <span data-lkey="dash_btn_factory_reset">مسح كلي</span></button></header><main class="iframe-container"><div class="loader-overlay" id="loader"><div class="loader"></div></div><iframe id="hub-iframe" src="adminPanel.html"></iframe></main><script src="/js/config.js"></script><script src="/js/globalVariable.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script>// Apply Dark Mode if needed
        if (localStorage.getItem('app_theme') === 'dark') {
            document.body.classList.add('dark-theme');
        }

        const iframe = document.getElementById('hub-iframe');
        const loader = document.getElementById('loader');
        const buttons = document.querySelectorAll('.hub-btn[data-url]');

        // Navigation Handler
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const url = btn.getAttribute('data-url');

                // Active state
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Load URL
                showLoader();
                iframe.src = url;
            });
        });

        // Loader logic
        function showLoader() { loader.style.display = 'flex'; }
        function hideLoader() { loader.style.display = 'none'; }

        iframe.onload = () => {
            hideLoader();
            // Try to communicate with iframe to apply translations if needed
            // But usually the pages handle their own initialization
        };

        // Factory Reset Implementation
        document.getElementById('factory-reset-btn').addEventListener('click', () => {
            const title = window.langu ? window.langu("factory_reset_confirm_title") : "هل أنت متأكد؟";
            const text = window.langu ? window.langu("factory_reset_confirm_text") : "سيتم مسح كافة البيانات تماماً، لا يمكن التراجع!";

            Swal.fire({
                title: title,
                text: text,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: "نعم، امسح الكل",
                cancelButtonText: "إلغاء",
                customClass: {
                    popup: 'swal-modern-popup'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'جاري المسح...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    // Call the app's reset logic if available in parent or defined here
                    // Usually located in a shared utility
                    if (typeof window.appHardReset === 'function') {
                        window.appHardReset();
                    } else {
                        // Fallback: Clear local storage and reload
                        localStorage.clear();
                        window.location.href = '../../index.html';
                    }
                }
            });
        });

        // Initialize translations
        document.addEventListener('DOMContentLoaded', () => {
            if (window.initializeTranslations) window.initializeTranslations();
        });</script></body></html>
