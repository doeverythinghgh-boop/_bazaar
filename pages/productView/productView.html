<!DOCTYPE html><html id="index-html-root" lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>عرض المنتج - Suez Bazaar</title><script src="../../js/core-loader.js"></script><link rel="stylesheet" href="css/view-layout.css"><link rel="stylesheet" href="css/view-gallery.css"><link rel="stylesheet" href="css/view-info.css"><link rel="stylesheet" href="css/view-actions.css"><script src="js/view_config.js" defer="defer"></script><script src="js/view_utils.js" defer="defer"></script><script src="js/view_ui.js" defer="defer"></script><script src="js/view_init.js" defer="defer"></script></head><body style="background-color:var(--bg-color-light)"><div id="header-injection-point"></div><div id="loader-container" class="loader"></div><div class="productView_modal_content" id="productView_modal_content" style="display:none"><div id="productView_title_section" class="productView_title_section"><h1 id="productView_name"></h1></div><div class="productView_image_container" id="productView_image_container"><div id="productView_main_image_wrapper" class="productView_main_image_wrapper"><img id="productView_image" src="" alt="صورة المنتج"></div><div class="productView_thumbnails_container" id="productView_thumbnails_container"></div></div><div class="productView_details" id="productView_details_container"><div id="productView_price_card" class="productView_price_card"><div id="productView_price_main" class="productView_price_main"><div id="productView_price_row" style="display:flex;align-items:center;gap:10px"><span id="productView_price"></span> <span id="productView_discount_badge" class="productView_discount_badge" style="display:none"></span></div><span id="productView_original_price_container" class="productView_price_old" style="display:none"><span id="productView_original_price"></span></span></div><div id="productView_quantity_container" class="productView_stock_info"><i id="productView_stock_icon" class="fas fa-boxes"></i> <span id="productView_stock_label" data-lkey="pv_available_quantity">المخزن:</span> <span id="productView_quantity_value"></span></div></div><div id="productView_info_grid" class="productView_info_grid"><div class="productView_info_item" id="productView_description_container"><div id="productView_description_label_row" class="productView_info_label"><i id="productView_description_icon" class="fas fa-align-right"></i> <span id="productView_description_header_text" data-lkey="pv_description_header">الوصف</span></div><div id="productView_description_text" class="productView_info_content"></div></div><div class="productView_info_item" id="productView_seller_message_container"><div id="productView_seller_message_label_row" class="productView_info_label"><i id="productView_seller_message_icon" class="fas fa-quote-right"></i> <span id="productView_seller_message_header_text" data-lkey="pv_seller_message_header">كلمة البائع</span></div><div id="productView_seller_message_text" class="productView_info_content italic"></div></div></div><div class="productView_seller_card" id="productView_seller_card"><div id="productView_seller_info_minimal" class="productView_seller_info_minimal"><div id="productView_seller_text_container" class="productView_seller_text"><span id="productView_seller_label" class="productView_seller_label" data-lkey="pv_sold_by">بواسطة</span> <span id="productView_display_seller_name" class="productView_seller_name">...</span></div><button id="productView_go_to_seller_btn" class="productView_seller_btn"><i id="productView_store_icon" class="fas fa-store"></i> <span id="productView_view_portfolio_text" data-lkey="pv_view_portfolio">زيارة المتجر</span></button></div></div><div class="productView_purchase_section" id="productView_cart_actions"><div id="productView_action_row" class="productView_action_row"><div id="productView_quantity_box" class="productView_quantity_box"><button class="qty_btn dec" id="productView_decrease_quantity_btn">-</button> <input type="number" id="productView_selected_quantity_input" value="1" min="1" readonly="readonly"> <button class="qty_btn inc" id="productView_increase_quantity_btn">+</button></div><div id="productView_total_box" class="productView_total_box"><span id="productView_total_price" class="total_value"></span><div id="productView_savings_row" style="display:none;align-items:center;gap:5px;color:#27ae60;font-size:.85rem;font-weight:700"><i class="fas fa-hand-holding-usd"></i> <span id="productView_total_savings"></span></div></div></div><button class="productView_primary_btn" id="productView_add_to_cart_btn"><i id="productView_cart_icon" class="fas fa-shopping-basket"></i> <span id="productView_add_to_cart_text" data-lkey="pv_add_to_cart">إضافة للسلة</span></button></div><div id="productView_admin_seller_info" class="productView_admin_box" style="display:none"><div id="productView_admin_header" class="productView_admin_header"><i id="productView_admin_shield_icon" class="fas fa-user-shield"></i> <span id="productView_admin_title_text" data-lkey="pv_admin_seller_title">لوحة الإدارة</span></div><div id="productView_admin_grid" class="productView_admin_grid"><div id="admin_field_id" class="admin_field"><strong id="admin_label_id">ID:</strong> <span id="productView_admin_seller_key"></span></div><div id="admin_field_main" class="admin_field"><strong id="admin_label_main">Main:</strong> <span id="productView_admin_main_category"></span></div><div id="admin_field_sub" class="admin_field"><strong id="admin_label_sub">Sub:</strong> <span id="productView_admin_sub_category"></span></div><div id="admin_field_price" class="admin_field highlight"><strong id="admin_label_price">App Price:</strong> <span id="productView_real_price"></span></div><div id="admin_field_heavy" class="admin_field"><strong id="admin_label_heavy">Heavy:</strong> <span id="productView_heavy_load_value"></span></div></div><div id="productView_admin_actions" class="productView_admin_actions"><button id="productView_edit_btn" class="admin_action_btn edit"><i class="fas fa-edit"></i> <span data-lkey="pv_edit_product">تعديل</span></button> <button id="productView_delete_btn" class="admin_action_btn delete"><i class="fas fa-trash-alt"></i> <span data-lkey="pv_delete_product">حذف</span></button></div></div></div></div><script>document.addEventListener('DOMContentLoaded', async function () {
      // 1. Initialize Theme (Dark Mode support)
      if (typeof initAppTheme === 'function') initAppTheme();

      // 2. Initialize Translations (CRITICAL: Load before session and header)
      if (typeof loadIndexTranslations === 'function') {
        await window.loadIndexTranslations();
      }

      // 3. Initialize Session (Syncs UI, depends on translations)
      if (typeof SessionManager !== 'undefined') {
        SessionManager.init();
      }

      // 4. Load Core Data
      if (typeof fetchAppCategories === 'function') await fetchAppCategories();

      // 5. Initialize Header (Depends on translations)
      if (typeof AppHeader !== 'undefined' && AppHeader.init) {
        await AppHeader.init('header-injection-point', 'index-home-btn');
      }

      // 6. Initialize Page Content (After translations)
      if (typeof productView_initPage === 'function') {
        productView_initPage();
      }
    });</script></body></html>
