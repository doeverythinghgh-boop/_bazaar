<script src="/LocalDatabasesProject/local-db.js"></script>
<script src="/js/early-error-bootstrap.js"></script>
<!-- 
  Portfolio Search Modal Component
  Standalone HTML for the centralized search interface.
-->
<div id="portfolio-search-modal-overlay" class="portfolio-search-modal-overlay" style="display: none;">
    <div id="portfolio-search-modal-container" class="portfolio-search-modal-container glass-card">
        
        <!-- Modal Top Bar: Close Button (Positioned correctly for LTR/RTL) -->
        <div id="portfolio-search-modal-top-bar" class="portfolio-search-modal-top-bar">
            <button id="btn-portfolio-search-modal-close" class="portfolio-modal-close-btn-top" title="إغلاق">
                <i id="portfolio-modal-close-btn-icon" class="fas fa-times"></i>
            </button>
        </div>

        <!-- Modal Header: Search Input -->
        <div id="portfolio-search-modal-header" class="portfolio-search-modal-header">
            <div id="portfolio-search-input-wrapper" class="portfolio-search-input-wrapper">
                <div id="portfolio-search-input-start-actions" class="input-start-actions-wrapper">
                    <button id="btn-portfolio-search-modal-clear-text" class="clear-text-btn" style="display: none;" title="مسح النص">
                        <i id="portfolio-search-modal-clear-icon" class="fas fa-times-circle"></i>
                    </button>
                </div>

                <input type="text" id="portfolio-search-modal-input" class="portfolio-search-modal-input" 
                       placeholder="ابحث باسم المنتج أو الوصف..." 
                       aria-label="بحث">
                
                <div id="portfolio-search-input-actions" class="input-actions-wrapper">
                    <div id="portfolio-search-modal-voice-slot" class="voice-slot"></div>
                </div>
            </div>
        </div>

        <!-- Modal Footer: Actions -->
        <div id="portfolio-search-modal-footer" class="portfolio-search-modal-footer">
            <button id="btn-portfolio-modal-perform-search" class="portfolio-modal-search-btn">
                <i id="portfolio-modal-search-btn-icon" class="fas fa-search"></i>
                <span id="portfolio-modal-search-btn-text" data-lkey="alert_confirm_btn">بحث</span>
            </button>
            <button id="portfolio-modal-sort-trigger" class="portfolio-modal-sort-btn">
                <i id="portfolio-modal-sort-icon" class="fas fa-sort-amount-down-alt"></i>
                <span id="portfolio-modal-sort-display" data-lkey="search_modal_sort_label">الترتيب حسب</span>
            </button>
        </div>
    </div>
</div>
