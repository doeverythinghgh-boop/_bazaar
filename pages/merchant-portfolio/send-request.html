<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>إرسال طلب مباشر للصيدلية - Suez Bazaar</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="/js/app-behavior.js"></script><script src="/js/core-loader-bootstrap.js"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="/pages/merchant-portfolio/css/send-request.css"><script src="/pages/merchant-portfolio/js/send-request-init.js" defer="defer"></script><script src="/pages/merchant-portfolio/js/send-request-submit.js" defer="defer"></script></head><body><div id="header-injection-point"></div><div class="request-page-container"><div class="request-card" id="request-card"><div class="merchant-header"><img id="merchant-avatar" src="/img/icons/merchant-default.png" alt="Merchant Avatar"><div class="merchant-info"><h2 id="merchant-name" data-lkey="port_req_loading">جاري التحميل...</h2><span><i class="fas fa-check-circle"></i> <span data-lkey="port_req_verified_pharmacy">صيدلية معتمدة</span></span></div></div><div class="input-section"><textarea id="request-notes" data-lplaceholder="port_req_textarea_placeholder" placeholder="أضف ملاحظاتك أو اكتب اسم الدواء المطلوب هنا... (يمكنك استخدام الميكروفون للتحدث)"></textarea><div class="voice-btn-container"><button id="btn-voice-rec" class="btn-voice" title="تحويل الصوت إلى نص"><i class="fas fa-microphone"></i></button></div></div><div class="uploader-section"><span class="uploader-title" id="uploader-title" data-lkey="port_req_attach_subtitle">أرفق صور (روشتة، علبة دواء، إلخ)</span><div class="uploader-area" id="uploader-area"><i class="fas fa-cloud-upload-alt"></i><p data-lkey="port_req_upload_hint">اسحب الصور هنا أو اضغط للاختيار</p><p style="font-size:.75rem;opacity:.7" data-lkey="port_req_max_images">أقصى عدد: 4 صور</p><input type="file" id="file-input" accept="image/*" multiple="multiple" style="display:none"></div><div class="previews-grid" id="previews-grid"></div></div><div class="actions-section"><button class="btn-submit-request" id="btn-submit-request" onclick="req_submitRequest()"><i class="fas fa-paper-plane"></i> <span data-lkey="port_req_submit_btn">إرسال الطلب الآن</span></button></div></div></div><script>document.addEventListener('DOMContentLoaded', async function () {
            // 1. Initialize Theme (Dark Mode support)
            if (typeof initAppTheme === 'function') initAppTheme();

            // 2. Initialize Translations (CRITICAL: Load before session and header)
            if (typeof loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            // 3. Initialize Session (Syncs UI, depends on translations)
            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
            }

            // 4. Load Core Data
            if (typeof fetchAppCategories === 'function') await fetchAppCategories();

            // 5. Initialize Header (Depends on translations)
            if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                await AppHeader.init('header-injection-point');
            }

            // 6. Initialize Page Content (After translations)
            if (typeof req_initPage === 'function') {
                req_initPage();
            }
        });</script></body></html>
