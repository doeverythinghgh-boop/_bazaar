<!DOCTYPE html><html id="req-html-root" lang="ar" dir="rtl"><head id="req-head"><script src="/LocalDatabasesProject/local-db.js"></script><script src="/js/early-error-bootstrap.js"></script><meta id="meta-charset" charset="UTF-8"><meta id="meta-viewport" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title id="req-page-title" data-lkey="port_req_page_title">إرسال طلب مباشر - Suez Bazaar</title><link id="link-fontawesome" rel="stylesheet" href="/assets/fontawesome/css/all.css"><script id="script-app-behavior" src="/js/app-behavior.js"></script><script id="script-core-loader" src="/js/core-loader-bootstrap.js"></script><script id="script-tools-text" src="/js/tools-text.js"></script><script id="script-settings-fetch" src="/js/shared/settings-fetch.js"></script><script id="script-cloud-file-manager" src="/js/cloudFileManager.js"></script><script id="script-tools" src="/js/tools.js"></script><script id="script-swal" src="/assets/libs/sweetalert2/sweetalert2.all.min.js"></script><script id="script-port-cache" src="/pages/merchant-portfolio/js/core/portfolio-cache.js"></script><script id="script-port-safe-fetch" src="/pages/merchant-portfolio/js/services/portfolio-safe-fetch.js"></script><script id="script-port-api" src="/pages/merchant-portfolio/js/services/portfolio-api.js"></script><script id="script-voice-stt" src="/js/shared/voice-stt-utility.js"></script><link id="link-page-css" rel="stylesheet" href="/pages/merchant-portfolio/css/send-request.css"><link rel="stylesheet" href="/style/loader.css"><link rel="stylesheet" href="/style/voice-stt-shared.css"><script id="script-request-cart" src="/pages/merchant-portfolio/js/services/send-request/pharmacy-request-cart.js" defer="defer"></script><script id="script-page-state" src="/pages/merchant-portfolio/js/services/send-request/send-request-state.js" defer="defer"></script><script id="script-page-ui" src="/pages/merchant-portfolio/js/services/send-request/send-request-ui.js" defer="defer"></script><script id="script-page-api" src="/pages/merchant-portfolio/js/services/send-request/send-request-api.js" defer="defer"></script><script id="script-page-media" src="/pages/merchant-portfolio/js/services/send-request/send-request-media.js" defer="defer"></script><script id="script-page-init" src="/pages/merchant-portfolio/js/services/send-request/send-request-init.js" defer="defer"></script></head><body id="req-body"><div id="header-injection-point"></div><div id="req-page-container" class="request-page-container"><div id="req-loader-container" class="loader" role="status" aria-live="polite" style="display:block;margin:10px auto 18px"></div><div class="request-card" id="request-card"><div id="req-merchant-header" class="merchant-header"><img id="merchant-avatar" alt="Merchant Avatar" style="background:rgba(0,0,0,.05)"><div id="req-merchant-info" class="merchant-info"><h2 id="merchant-name" data-lkey="port_req_loading">جاري التحميل...</h2></div></div><div id="req-queued-products-section" class="request-products-section" style="display:none"><div id="req-queued-products-title" class="request-products-title"><i id="req-queued-products-title-icon" class="fas fa-basket-shopping"></i> <span id="req-queued-products-title-text" data-lkey="port_req_queued_products_title">منتجات الطلب</span></div><div id="req-queued-products-list" class="request-products-list"></div></div><div id="req-details-card" class="request-details-card"><div class="request-details-card-header"><span class="details-card-title" id="req-details-card-title" data-lkey="port_req_details_title">تفاصيل</span> <button type="button" id="req-details-card-toggle" class="details-toggle-btn" aria-expanded="true" onclick="RequestUI.toggleDetailsCard()" title="طي / توسعة التفاصيل" style="display:none"><i class="fas fa-chevron-up"></i></button></div><div id="req-details-card-content" class="request-details-card-content"><div id="req-input-section" class="input-section"><textarea id="request-notes" data-lplaceholder="port_req_textarea_placeholder" placeholder="أضف ملاحظاتك أو تفاصيل طلبك هنا... (يمكنك استخدام الميكروفون للتحدث)"></textarea></div><div id="req-uploader-section" class="uploader-section"><span class="uploader-title" id="uploader-title" data-lkey="port_req_attach_subtitle">أرفق صوراً توضيحية لطلبك (إن وجدت)</span><div id="req-uploader-actions" class="uploader-actions"><button type="button" id="req-btn-gallery" class="uploader-btn primary-btn"><i id="req-gallery-icon" class="fas fa-images"></i> <span id="req-gallery-text" data-lkey="gen_btn_pick_images">المعرض</span></button> <button type="button" id="req-btn-camera" class="uploader-btn primary-btn"><i id="req-camera-icon" class="fas fa-camera"></i> <span id="req-camera-text" data-lkey="gen_btn_take_photo">الكاميرا</span></button> <input type="file" id="file-input" accept="image/*" multiple="multiple" style="display:none"> <input type="file" id="req-camera-input" accept="image/*" capture="environment" style="display:none"></div><div id="req-uploader-info" class="uploader-info"><p id="req-uploader-max-files-text" data-lkey="port_req_max_images">أقصى عدد: 4 صور</p></div><div class="previews-grid" id="previews-grid"></div></div></div></div><div id="req-actions-section" class="actions-section" style="margin-top:14px"><button class="btn-submit-request" id="btn-submit-request" onclick="req_submitRequest()"><i id="req-submit-icon" class="fas fa-paper-plane"></i> <span id="req-submit-text" data-lkey="port_req_submit_btn">إرسال الطلب الآن</span></button></div></div></div><script id="script-page-controller">document.addEventListener('DOMContentLoaded', async function () {
            // 1. Initialize Theme (Dark Mode support)
            if (typeof initAppTheme === 'function') initAppTheme();

            // 2. Initialize Translations (CRITICAL: Load before session and header)
            if (typeof loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            // 3. Initialize Session (Syncs UI, depends on translations)
            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
            }

            // 4. Load Core Data
            if (typeof fetchAppCategories === 'function') await fetchAppCategories();

            // 5. Initialize Header (Depends on translations).
            // Mark 'index-login-btn' as the active button because the send-request page
            // is part of the merchant portfolio flow, not the public home section.
            if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                await AppHeader.init('header-injection-point', 'index-login-btn');
            }

            // 6. Initialize Page Content (After translations)
            if (typeof req_initPage === 'function') {
                req_initPage();
            }
            // Loading management: show small in-page loader and hide card until ready
            (function manageInPageLoader() {
                console.info('[RequestPage] Showing in-page loader until full readiness.');
                const loader = document.getElementById('req-loader-container');
                const card = document.getElementById('request-card');
                if (!loader || !card) return;

                // start with loader visible and card hidden
                loader.style.display = 'block';
                card.style.display = 'none';

                let domLoadComplete = false;
                let reqInitComplete = false;

                function tryShow() {
                    if (domLoadComplete && reqInitComplete) {
                        console.info('[RequestPage] All readiness checks passed. Hiding loader and showing content.');
                        loader.style.display = 'none';
                        card.style.display = '';
                    }
                }

                window.addEventListener('load', function () {
                    console.info('[RequestPage] window.load event fired.');
                    domLoadComplete = true;
                    tryShow();
                });

                window.addEventListener('request-page-ready', function () {
                    console.info('[RequestPage] request-page-ready event received.');
                    reqInitComplete = true;
                    tryShow();
                });

                // Safety: if request init never fires within reasonable time, still hide after 10s
                setTimeout(function () {
                    if (!domLoadComplete || !reqInitComplete) {
                        console.warn('[RequestPage] Fallback timeout reached. Forcing show of content.');
                        loader.style.display = 'none';
                        card.style.display = '';
                    }
                }, 10000);
            })();
        });</script></body></html>
