<!DOCTYPE html>
<html id="req-html-root" lang="ar" dir="rtl">
<head id="req-head">
    <meta id="meta-charset" charset="UTF-8">
    <meta id="meta-viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title id="req-page-title">إرسال طلب مباشر للصيدلية - Suez Bazaar</title>

    <!-- Core Styles & Icons -->
    <link id="link-fontawesome" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Core Loader Scripts -->
    <script id="script-app-behavior" src="/js/app-behavior.js"></script>
    <script id="script-core-loader" src="/js/core-loader-bootstrap.js"></script>
    <script id="script-tools-text" src="/js/tools-text.js"></script>
    <script id="script-settings-fetch" src="/js/shared/settings-fetch.js"></script>
    <script id="script-cloud-file-manager" src="/js/cloudFileManager.js"></script>
    <script id="script-tools" src="/js/tools.js"></script>
    <script id="script-tools" src="/js/tools.js"></script>
    <script id="script-swal" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Portfolio Service Adapters -->
    <script id="script-port-cache" src="/pages/merchant-portfolio/js/portfolio-cache.js"></script>
    <script id="script-port-safe-fetch" src="/pages/merchant-portfolio/js/services/portfolio-safe-fetch.js"></script>
    <script id="script-port-api" src="/pages/merchant-portfolio/js/services/portfolio-api.js"></script>

    <!-- Page Specific Styles -->
    <link id="link-page-css" rel="stylesheet" href="/pages/merchant-portfolio/css/send-request.css">
    <link rel="stylesheet" href="/style/voice-stt-shared.css">

    <!-- Page Specific Scripts (Modular Architecture) -->
    <script id="script-page-state" src="/pages/merchant-portfolio/js/send-request-state.js" defer></script>
    <script id="script-page-ui" src="/pages/merchant-portfolio/js/send-request-ui.js" defer></script>
    <script id="script-page-api" src="/pages/merchant-portfolio/js/send-request-api.js" defer></script>
    <script id="script-page-media" src="/pages/merchant-portfolio/js/send-request-media.js" defer></script>
    <script id="script-page-init" src="/pages/merchant-portfolio/js/send-request-init.js" defer></script>
</head>
<body id="req-body">

    <!-- Voice STT Initialization via Core Scanner now -->
    <div id="header-injection-point"></div>

    <div id="req-page-container" class="request-page-container">
        <div class="request-card" id="request-card">
            
            <!-- Merchant Profile Header -->
            <div id="req-merchant-header" class="merchant-header">
                <img id="merchant-avatar" src="/images/icons/icon-192x192.png" alt="Merchant Avatar">
                <div id="req-merchant-info" class="merchant-info">
                    <h2 id="merchant-name" data-lkey="port_req_loading">جاري التحميل...</h2>
                    <span id="req-merchant-badge-container"><i id="req-merchant-badge-icon" class="fas fa-check-circle"></i> <span id="req-merchant-badge-text" data-lkey="port_req_verified_pharmacy">صيدلية معتمدة</span></span>
                </div>
            </div>

            <!-- Notes Input Area -->
            <div id="req-input-section" class="input-section">
                <textarea id="request-notes" data-lplaceholder="port_req_textarea_placeholder" placeholder="أضف ملاحظاتك أو اكتب اسم الدواء المطلوب هنا... (يمكنك استخدام الميكروفون للتحدث)"></textarea>
            </div>

            <!-- Image Uploader -->
            <div id="req-uploader-section" class="uploader-section">
                <span class="uploader-title" id="uploader-title" data-lkey="port_req_attach_subtitle">أرفق صور (روشتة، علبة دواء، إلخ)</span>
                
                <div id="req-uploader-actions" class="uploader-actions">
                    <button type="button" id="req-btn-gallery" class="uploader-btn primary-btn">
                        <i id="req-gallery-icon" class="fas fa-images"></i>
                        <span id="req-gallery-text" data-lkey="gen_btn_pick_images">المعرض</span>
                    </button>
                    <button type="button" id="req-btn-camera" class="uploader-btn primary-btn">
                        <i id="req-camera-icon" class="fas fa-camera"></i>
                        <span id="req-camera-text" data-lkey="gen_btn_take_photo">الكاميرا</span>
                    </button>
                    <!-- Hidden Inputs -->
                    <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
                    <input type="file" id="req-camera-input" accept="image/*" capture="environment" style="display: none;">
                </div>

                <div id="req-uploader-info" class="uploader-info">
                    <p id="req-uploader-max-files-text" data-lkey="port_req_max_images">أقصى عدد: 4 صور</p>
                </div>

                <div class="previews-grid" id="previews-grid"></div>
            </div>

            <!-- Action Buttons -->
            <div id="req-actions-section" class="actions-section">
                <button class="btn-submit-request" id="btn-submit-request" onclick="req_submitRequest()">
                    <i id="req-submit-icon" class="fas fa-paper-plane"></i>
                    <span id="req-submit-text" data-lkey="port_req_submit_btn">إرسال الطلب الآن</span>
                </button>
            </div>

        </div>
    </div>

    <script id="script-page-controller">
        document.addEventListener('DOMContentLoaded', async function () {
            // 1. Initialize Theme (Dark Mode support)
            if (typeof initAppTheme === 'function') initAppTheme();

            // 2. Initialize Translations (CRITICAL: Load before session and header)
            if (typeof loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            // 3. Initialize Session (Syncs UI, depends on translations)
            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
            }

            // 4. Load Core Data
            if (typeof fetchAppCategories === 'function') await fetchAppCategories();

            // 5. Initialize Header (Depends on translations)
            if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                await AppHeader.init('header-injection-point');
            }

            // 6. Initialize Page Content (After translations)
            if (typeof req_initPage === 'function') {
                req_initPage();
            }
        });
    </script>
</body>
</html>
