<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-lkey="pharmacy_add_page_title">إضافة منتج صيدلية جديد</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="/style/variables.css"><link rel="stylesheet" href="/pages/merchant-portfolio/css/pharmacy-add-product.css"></head><body><div id="header-injection-point"></div><header id="pharmacy-header" class="pharmacy-header"><div id="pharmacy-header-title-container" class="header-title"><h1 id="pharmacy-heading" data-lkey="pharmacy_add_heading"><i id="pharmacy-heading-icon" class="fas fa-plus-circle"></i> إضافة منتج للصيدلية</h1></div><div id="pharmacy-header-spacer" style="width:80px"></div></header><main id="pharmacy-main-content" class="pharmacy-main-content"><div id="pharmacy-form-container" class="form-container"><div id="loader" class="pharmacy-loader" aria-live="polite"><div id="pharmacy-loader-spinner" class="loader" aria-hidden="true"></div><div id="pharmacy-loader-text" class="pharmacy-loader__text" data-lkey="pharmacy_add_loading_categories">جاري تحميل الفئات...</div></div><div id="categories-section" class="form-section"><h2 id="pharmacy-cat-section-title" data-lkey="pharmacy_add_cat_section_title"><i id="pharmacy-cat-section-icon" class="fas fa-list-alt"></i> تصنيف المنتج</h2><div id="pharmacy-main-cat-group" class="form-group"><label id="pharmacy-main-cat-label" for="main-category" data-lkey="pharmacy_add_main_cat_label">الفئة الرئيسية</label> <select id="main-category" class="custom-select"><option id="pharmacy-main-cat-placeholder" value="" data-lkey="pharmacy_add_main_cat_placeholder">-- اختر الفئة الرئيسية --</option></select></div><div id="pharmacy-sub-cat-group" class="form-group"><label id="pharmacy-sub-cat-label" for="sub-category" data-lkey="pharmacy_add_sub_cat_label">الفئة الفرعية</label> <select id="sub-category" class="custom-select" disabled="disabled"><option id="pharmacy-sub-cat-placeholder" value="" data-lkey="pharmacy_add_sub_cat_placeholder">-- يرجى اختيار الفئة الرئيسية أولاً --</option></select></div></div><div id="product-details-section" class="form-section hidden"><div id="pharmacy-section-divider" class="section-divider"></div><h2 id="pharmacy-details-title" data-lkey="pharmacy_add_details_title"><i id="pharmacy-details-icon" class="fas fa-info-circle"></i> بيانات المنتج الجديد</h2><div id="pharmacy-name-row" class="form-row"><div id="pharmacy-name-ar-group" class="form-group"><label id="pharmacy-name-ar-label" for="product-name-ar" data-lkey="pharmacy_add_name_ar_label">اسم المنتج (عربي) <span id="pharmacy-name-ar-req" class="required">*</span></label> <input type="text" id="product-name-ar" class="custom-input" placeholder="مثال: بنادول للصداع" data-lkey="pharmacy_add_name_ar_placeholder"></div><div id="pharmacy-name-en-group" class="form-group"><label id="pharmacy-name-en-label" for="product-name-en" data-lkey="pharmacy_add_name_en_label">اسم المنتج (إنجليزي)</label> <input type="text" id="product-name-en" class="custom-input" placeholder="Example: Panadol Advance" data-lkey="pharmacy_add_name_en_placeholder"></div></div><div id="pharmacy-price-row" class="form-row"><div id="pharmacy-price-group" class="form-group"><label id="pharmacy-price-label" for="product-price" data-lkey="pharmacy_add_price_label">سعر المستهلك (ج.م) <span id="pharmacy-price-req" class="required">*</span></label> <input type="number" id="product-price" class="custom-input" placeholder="0.00" step="0.5" data-lkey="pharmacy_add_price_placeholder"></div><div id="pharmacy-discount-group" class="form-group"><label id="pharmacy-discount-label" for="product-discount" data-lkey="pharmacy_add_discount_label">نسبة الخصم % (اختياري)</label> <input type="number" id="product-discount" class="custom-input" placeholder="0" data-lkey="pharmacy_add_discount_placeholder"></div></div><div id="pharmacy-desc-group" class="form-group"><label id="pharmacy-desc-label" for="product-description" data-lkey="pharmacy_add_desc_label">وصف المنتج (الاستخدام والجرعة)</label> <textarea id="product-description" class="custom-input" rows="3" placeholder="اكتب التفاصيل الطبية والوصف هنا..." data-lkey="pharmacy_add_desc_placeholder"></textarea></div><div id="pharmacy-rx-row" class="form-row"><div id="pharmacy-rx-group" class="form-group checkbox-group"><input type="checkbox" id="product-rx" class="custom-checkbox"> <label id="pharmacy-rx-label" for="product-rx" class="checkbox-label" data-lkey="pharmacy_add_rx_label"><i id="pharmacy-rx-icon" class="fas fa-file-prescription rx-icon"></i> هذا المنتج يحتاج إلى وصفة طبية (روشتة)</label></div></div><div id="pharmacy-img-group" class="form-group"><label id="pharmacy-img-label" data-lkey="pharmacy_add_img_label">صورة المنتج</label><div id="pharmacy-img-wrapper" class="image-upload-wrapper"><input type="file" id="product-image" accept="image/*" class="custom-file-input"><div id="pharmacy-upload-placeholder" class="upload-placeholder" data-lkey="pharmacy_add_img_placeholder"><i id="pharmacy-upload-icon" class="fas fa-cloud-upload-alt"></i> <span id="pharmacy-drag-text" data-lkey="pharmacy_add_img_drag_text">اسحب الصورة هنا أو اضغط للاختيار</span></div></div></div><button id="btn-submit-product" class="btn-submit" data-lkey="pharmacy_add_submit_btn">حفظ وإضافة المنتج <i id="pharmacy-submit-icon" class="fas fa-check"></i></button></div></div></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="/pages/merchant-portfolio/js/pharmacy-backend-api.js"></script><script src="/pages/merchant-portfolio/js/pharmacy-add-product.js"></script><script src="/js/core-loader-bootstrap.js"></script><script>document.addEventListener('DOMContentLoaded', async () => {
            if (typeof window.loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }
            if (typeof SessionManager !== 'undefined' && SessionManager.init) {
                SessionManager.init();
            }
            if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                await AppHeader.init('header-injection-point');
            }
        });</script></body></html>
