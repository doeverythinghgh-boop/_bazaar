<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إضافة منتج صيدلية جديد</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><link rel="stylesheet" href="/css/variables.css"><link rel="stylesheet" href="/pages/merchant-portfolio/css/pharmacy-add-product.css"></head><body><header class="pharmacy-header"><button class="btn-back" onclick="history.back()"><i class="fas fa-arrow-right"></i> رجوع</button><div class="header-title"><h1><i class="fas fa-plus-circle"></i> إضافة منتج للصيدلية</h1></div><div style="width:80px"></div></header><main class="pharmacy-main-content"><div class="form-container"><div id="loader" class="loader"><i class="fas fa-spinner fa-spin"></i> جاري تحميل الفئات...</div><div id="categories-section" class="form-section"><h2><i class="fas fa-list-alt"></i> تصنيف المنتج</h2><div class="form-group"><label for="main-category">الفئة الرئيسية</label> <select id="main-category" class="custom-select"><option value="">-- اختر الفئة الرئيسية --</option></select></div><div class="form-group"><label for="sub-category">الفئة الفرعية</label> <select id="sub-category" class="custom-select" disabled="disabled"><option value="">-- يرجى اختيار الفئة الرئيسية أولاً --</option></select></div></div><div id="product-details-section" class="form-section hidden"><div class="section-divider"></div><h2><i class="fas fa-info-circle"></i> بيانات المنتج الجديد</h2><div class="form-row"><div class="form-group"><label for="product-name-ar">اسم المنتج (عربي) <span class="required">*</span></label> <input type="text" id="product-name-ar" class="custom-input" placeholder="مثال: بنادول للصداع"></div><div class="form-group"><label for="product-name-en">اسم المنتج (إنجليزي)</label> <input type="text" id="product-name-en" class="custom-input" placeholder="Example: Panadol Advance"></div></div><div class="form-row"><div class="form-group"><label for="product-price">سعر المستهلك (ج.م) <span class="required">*</span></label> <input type="number" id="product-price" class="custom-input" placeholder="0.00" step="0.5"></div><div class="form-group"><label for="product-discount">نسبة الخصم % (اختياري)</label> <input type="number" id="product-discount" class="custom-input" placeholder="0"></div></div><div class="form-group"><label for="product-description">وصف المنتج (الاستخدام والجرعة)</label> <textarea id="product-description" class="custom-input" rows="3" placeholder="اكتب التفاصيل الطبية والوصف هنا..."></textarea></div><div class="form-row"><div class="form-group checkbox-group"><input type="checkbox" id="product-rx" class="custom-checkbox"> <label for="product-rx" class="checkbox-label"><i class="fas fa-file-prescription rx-icon"></i> هذا المنتج يحتاج إلى وصفة طبية (روشتة)</label></div></div><div class="form-group"><label>صورة المنتج</label><div class="image-upload-wrapper"><input type="file" id="product-image" accept="image/*" class="custom-file-input"><div class="upload-placeholder"><i class="fas fa-cloud-upload-alt"></i> <span>اسحب الصورة هنا أو اضغط للاختيار</span></div></div></div><button id="btn-submit-product" class="btn-submit">حفظ وإضافة المنتج <i class="fas fa-check"></i></button></div></div></main><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="/pages/merchant-portfolio/js/pharmacy-backend-api.js"></script><script src="/pages/merchant-portfolio/js/pharmacy-add-product.js"></script></body></html>
