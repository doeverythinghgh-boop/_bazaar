<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ملف التاجر | Suez Bazaar</title><script src="/js/core-loader.js"></script><link rel="stylesheet" href="css/portfolio-glass.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head><body class="portfolio-body"><div id="header-injection-point"></div><div class="portfolio-container" id="portfolio-main-container" style="display:none"><div class="glass-card profile-card"><div class="profile-header"><div class="avatar-container"><img id="portfolio-avatar" src="https://placehold.co/100x100?text=No+Image" onerror="this.onerror=null;" alt="صورة التاجر" class="profile-avatar"><div id="portfolio-verification-badge" class="verification-badge" style="display:none"><i class="fas fa-check-circle"></i></div></div><h1 id="portfolio-name" class="profile-name">اسم التاجر</h1><div class="profile-rating-summary"><span id="portfolio-stars" class="stars"></span> <span id="portfolio-rating-count" class="rating-count">(0 تقييم)</span></div><p id="portfolio-bio" class="profile-bio"></p><div class="profile-tags" id="portfolio-tags"></div></div><div class="profile-actions"><button id="btn-share" class="glass-btn action-btn"><i class="fas fa-share-alt"></i> مشاركة</button> <button id="btn-rate" class="glass-btn action-btn"><i class="fas fa-star"></i> تقييم</button></div><div class="contact-actions"><a id="btn-whatsapp" href="#" target="_blank" class="glass-btn contact-btn whatsapp-btn" style="display:none"><i class="fab fa-whatsapp"></i> واتساب </a><a id="btn-call" href="#" class="glass-btn contact-btn call-btn" style="display:none"><i class="fas fa-phone"></i> اتصال</a></div></div><div class="glass-card products-section"><div class="section-header"><h2>منتجات التاجر</h2><button id="btn-toggle-products" class="glass-btn sm-btn"><i class="fas fa-chevron-down"></i>              // 1. Initialize Theme
             if (typeof initAppTheme === 'function') initAppTheme();

             // 2. Load Translations
             if (typeof window.loadIndexTranslations === 'function') await window.loadIndexTranslations();

             // 3. Initialize Session (Crucial for Header)
             if (typeof SessionManager !== 'undefined' && SessionManager.init) {
                 SessionManager.init();
             }
             
             // 4. Header
             if (typeof AppHeader !== 'undefined' && AppHeader.init) await AppHeader.init('header-injection-point');

             // 5. Init Portfolio
             if (typeof initPortfolio === 'function') initPortfolio();
        });</script></body></html>
