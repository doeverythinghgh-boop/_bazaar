<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ملف التاجر | Suez Bazaar</title>

    <!-- Core Loader -->
    <script src="/js/core-loader.js"></script>

    <!-- Page Styles -->
    <link rel="stylesheet" href="css/portfolio-glass.css">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="portfolio-body">

    <!-- Header Injection -->
    <div id="header-injection-point"></div>

    <!-- Main Container -->
    <div class="portfolio-container" id="portfolio-main-container" style="display: none;">
        
        <!-- Profile Card -->
        <div class="glass-card profile-card">
            <div class="profile-header">
                <div class="avatar-container">
                    <img id="portfolio-avatar" src="https://placehold.co/100x100?text=No+Image" onerror="this.onerror=null;" alt="صورة التاجر" class="profile-avatar">
                    <div id="portfolio-verification-badge" class="verification-badge" style="display: none;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
                <h1 id="portfolio-name" class="profile-name">اسم التاجر</h1>
                <div class="profile-rating-summary">
                    <span id="portfolio-stars" class="stars"></span>
                    <span id="portfolio-rating-count" class="rating-count">(0 تقييم)</span>
                </div>
                <p id="portfolio-bio" class="profile-bio"></p>
                
                <div class="profile-tags" id="portfolio-tags">
                    <!-- Tags inserted locally -->
                </div>
            </div>

            <div class="profile-actions">
                <button id="btn-share" class="glass-btn action-btn">
                    <i class="fas fa-share-alt"></i> مشاركة
                </button>
                <button id="btn-rate" class="glass-btn action-btn">
                    <i class="fas fa-star"></i> تقييم
                </button>
            </div>
            
            <div class="contact-actions">
                <a id="btn-whatsapp" href="#" target="_blank" class="glass-btn contact-btn whatsapp-btn" style="display: none;">
                    <i class="fab fa-whatsapp"></i> واتساب
                </a>
                <a id="btn-call" href="#" class="glass-btn contact-btn call-btn" style="display: none;">
                    <i class="fas fa-phone"></i> اتصال
                </a>
            </div>
        </div>

        <!-- Products Section -->
        <div class="glass-card products-section">
            <div class="section-header">
                <h2>منتجات التاجر</h2>
                <button id="btn-toggle-products" class="glass-btn sm-btn">
                    <i class="fas fa-chevron-down"></i> عرض المنتجات
                </button>
            </div>
            
            <div id="portfolio-products-grid" class="products-grid" style="display: none;">
                <!-- Products Injected Here -->
            </div>
            <div id="portfolio-loading" class="loading-spinner" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i> جاري التحميل...
            </div>
            <div id="portfolio-empty" class="empty-state" style="display: none;">
                <i class="fas fa-box-open"></i> لا توجد منتجات حالياً
            </div>
        </div>

    </div>

    <!-- Error State -->
    <div id="portfolio-error" class="error-container" style="display: none;">
        <i class="fas fa-exclamation-triangle"></i>
        <p>عذراً، لم يتم العثور على هذا التاجر.</p>
        <a href="/" class="glass-btn">العودة للرئيسية</a>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/portfolio-fetch.js"></script>
    <script src="js/portfolio-render.js"></script>
    <script src="js/portfolio-actions.js"></script>
    <script src="js/portfolio-init.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
             // 1. Initialize Theme
             if (typeof initAppTheme === 'function') initAppTheme();

             // 2. Load Translations
             if (typeof window.loadIndexTranslations === 'function') await window.loadIndexTranslations();

             // 3. Initialize Session (Crucial for Header)
             if (typeof SessionManager !== 'undefined' && SessionManager.init) {
                 SessionManager.init();
             }
             
             // 4. Header
             if (typeof AppHeader !== 'undefined' && AppHeader.init) await AppHeader.init('header-injection-point');

             // 5. Init Portfolio
             if (typeof initPortfolio === 'function') initPortfolio();
        });
    </script>
</body>
</html>
