<!DOCTYPE html><html id="index-html-root" lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content"><title data-lkey="login_page_title">Suez Bazaar - تسجيل الدخول</title><script src="/js/app-behavior.js"></script><script src="/js/core-loader-bootstrap.js"></script><script src="/js/shared/auto-ids.js" defer="defer"></script><link rel="stylesheet" href="/pages/login/login.css"><script src="/pages/login/login-init.js" type="module" defer="defer"></script><script src="/pages/login/login-ui.js" type="module" defer="defer"></script><script src="/pages/login/login-submit.js" type="module" defer="defer"></script></head><body id="index-app-body"><div id="header-injection-point"></div><div id="login_form-wrapper" class="login_page-wrapper" style="display:none"><div id="login_form-container" class="login_container"><h2 id="login_title" data-lkey="login_text">تسجيل الدخول</h2><form id="login_form" autocomplete="on"><div id="login_phone-form-group" class="login_form-group"><label id="login_phone-label" for="login_phone"><span id="login_phone-label-text" data-lkey="label_phone">رقم الهاتف</span></label> <input type="tel" id="login_phone" name="username" required minlength="11" maxlength="15" pattern="[\+0-9]+" autocomplete="username tel" data-lkey-placeholder="label_phone" placeholder="رقم الهاتف"><div id="login_phone-error" class="login_error-message"></div></div><div id="login_password-form-group" class="login_form-group"><label id="login_password-label" for="login_password"><i id="login_password-icon" class="fas fa-lock"></i> <span id="login_password-label-text" data-lkey="label_password">كلمة المرور</span></label> <input type="password" id="login_password" name="current-password" required autocomplete="current-password" data-lkey-placeholder="auth_enter_password_placeholder" placeholder="كلمة المرور"> <i class="fas fa-eye login_toggle-password" id="login_togglePassword"></i><div id="login_password-error" class="login_error-message"></div></div><div class="login_actions-row"><button id="login_submit-btn" type="submit" class="button login_btn"><i class="fas fa-sign-in-alt login_btn-icon"></i> <span id="login_submit-btn-text" data-lkey="login_text">تسجيل الدخول</span></button> <a href="#" id="login_go-to-register-link" class="login_action-btn login_register-btn"><i class="fas fa-user-plus login_btn-icon"></i> <span id="login_no-account-text" data-lkey="no_account" style="display:none">ليس لديك حساب؟</span> <strong id="login_register-now-text" data-lkey="register_now">سجل الآن</strong> </a><a id="login_guest-btn" class="login_action-btn login_guest-btn"><i class="fas fa-user-tag login_btn-icon"></i> <span id="login_or-you-can-text" data-lkey="or_you_can" style="display:none">أو يمكنك</span> <strong id="login_as-guest-text" data-lkey="login_as_guest">الدخول كضيف</strong> <span id="login_browse-products-text" data-lkey="to_browse_products" style="display:none">لتصفح المنتجات</span> </a><button id="index-settings-btn" type="button" class="login_action-btn login_settings-btn" data-lkey-title="dash_settings_title" title="الإعدادات"><i id="index-settings-btn-icon" class="fas fa-cog login_btn-icon"></i> <strong id="index-settings-btn-text" data-lkey="dash_settings_title">الإعدادات</strong></button></div></form></div></div><div id="index-contact-container" style="background-color:var(--bg-color-light)"></div><script type="module">document.addEventListener('DOMContentLoaded', async function () {
            if (typeof window.initAppTheme === 'function') window.initAppTheme();

            if (typeof window.loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            if (typeof window.SessionManager !== 'undefined') {
                window.SessionManager.init();
            }

            if (typeof window.AppHeader !== 'undefined' && window.AppHeader.init) {
                await window.AppHeader.init('header-injection-point', 'index-login-btn');
            }

            if (typeof window.checkImpersonationMode === 'function') window.checkImpersonationMode();
            if (typeof window.runHeaderScrollTutorial === 'function') window.runHeaderScrollTutorial();
            if (typeof window.applyAppTranslations === 'function') {
                window.applyAppTranslations();
            }

            if (typeof window.loadPage === 'function') {
                window.loadPage();
            }
        });</script></body></html>
