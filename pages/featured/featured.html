<link rel="stylesheet" href="pages/featured/featured.css"><div id="featured-products-section"><div class="featured-header" id="featured-header-container"><div class="featured-title section-header-custom" id="featured-title-wrapper"><div class="section-header-icon-container" id="featured-icon-container"><i class="fas fa-star" id="featured-title-icon"></i></div><span id="featured-title-text" data-lkey="featured_products_title">الأكثر رواجاً</span></div></div><div class="featured-wrapper" id="featured-scroller-wrapper" style="overflow:hidden;width:100%"><div id="featured-track" class="featured-scroller"></div></div></div><script>/**
     * @file pages/featured/featured.js
     * @description Logic for displaying Featured Products (Favorites) banner.
     */
    (function () {
        // Translation Key Addition (Dynamically adding if not exists, or relying on lang files)
        // For now, hardcoded fallback in HTML, but we should use window.langu

        async function initFeaturedModule() {
            const container = document.getElementById('featured-products-section');
            const track = document.getElementById('featured-track');

            // Apply translations to the component
            if (typeof window.applyAppTranslations === 'function') {
                window.applyAppTranslations();
            }

            // 1. Get Data from Global Cache
            let products = [];
            if (window.selectedSearchProductsSet && window.selectedSearchProductsSet.size > 0) {
                // Convert Set to Array
                products = Array.from(window.selectedSearchProductsSet);
            } else {
                // Try fetching if empty (unlikely if Home loaded correctly)
                // If empty, hide section
                container.style.display = 'none';
                return;
            }

            // Filter out legacy strings (keys only) if we haven't upgraded them yet
            // Or handle them gracefully (skip them as we can't show img/price)
            const validProducts = products.filter(p => typeof p === 'object' && p.img);

            if (validProducts.length === 0) {
                // Check if Admin to show helper message
                const userStr = localStorage.getItem('loggedInUser');
                const user = userStr ? JSON.parse(userStr) : null;
                const isAdmin = user && (user.user_key === '682dri6b' || user.enableDevConsole);

                if (isAdmin) {
                    container.style.display = 'flex';
                    container.innerHTML = `
                        <div style="padding: 10px; text-align: center; border: 1px dashed #ccc; background: rgba(255,255,255,0.5); width: 100%; border-radius: 8px;">
                            <i class="fas fa-info-circle text-primary"></i>
                            <span style="font-size: 0.85rem; color: #555;">(Admin Only) No featured products selected. Check products in Search to add them.</span>
                        </div>
                    `;
                } else {
                    container.style.display = 'none';
                }
                return;
            }

            console.log(`[Featured] Displaying ${validProducts.length} items.`);
            container.style.display = 'flex';

            // 2. Build HTML
            // Repeat items to fill enough track width for a smooth loop
            const minItems = 15;
            let itemsToRender = [...validProducts];
            while (itemsToRender.length < minItems) {
                itemsToRender = [...itemsToRender, ...validProducts];
            }

            track.innerHTML = itemsToRender.map(product => {
                const imageUrl = product.img ? getPublicR2FileUrl(product.img) : 'images/placeholder.png';
                const price = typeof product.price === 'number' ? product.price.toFixed(2) : product.price;
                const isService = (typeof isServiceCategory === 'function')
                    ? isServiceCategory(product.MainCategory, product.SubCategory)
                    : false;

                return `
                <div class="featured-card" onclick="openFeaturedProduct('${product.key}')">
                    <div class="featured-img-container">
                        <img src="${imageUrl}" class="featured-img" loading="lazy" alt="${product.name}">
                    </div>
                    <div class="featured-details">
                        <div class="featured-name">${product.name}</div>
                        ${!isService ? `<div class="featured-price">${price} ${window.langu('currency_egp')}</div>` : ''}
                    </div>
                </div>
                `;
            }).join('');

            // 3. Enable JS Auto-Scroll (Support Touch & Pause)
            // Duplicate content once for seamless infinite scroll
            const originalHTML = track.innerHTML;
            track.innerHTML = originalHTML + originalHTML;

            let animationFrame;
            let isPaused = false;
            let lastTimestamp = 0;
            const scrollSpeedPerSecond = 35; // pixels per second
            const isRTL = document.documentElement.dir === 'rtl';

            // Determine scroll behavior (Chrome/Safari/Firefox handle scrollLeft in RTL differently)
            let scrollPos = 0;

            const step = (timestamp) => {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const elapsed = timestamp - lastTimestamp;
                lastTimestamp = timestamp;

                if (isPaused) {
                    animationFrame = requestAnimationFrame(step);
                    return;
                }

                const move = (scrollSpeedPerSecond * elapsed) / 1000;
                const halfWidth = track.scrollWidth / 2;

                if (!isRTL) {
                    scrollPos += move;
                    if (scrollPos >= halfWidth) scrollPos = 0;
                    track.scrollLeft = scrollPos;
                } else {
                    // RTL Logic: Support varying browser implementations
                    // We use a virtual scrollPos to avoid browser-specific scrollLeft negative/positive issues
                    scrollPos += move;
                    if (scrollPos >= halfWidth) scrollPos = 0;

                    // Apply to scrollLeft based on browser's RTL interpretation
                    // Most modern browsers (Chrome/Safari) treat scrollLeft as 0 at far right and negative as you move left
                    // But some might treat it as Max at far right. 
                    // To be safe, we try to set it relative to 0.
                    track.scrollLeft = -scrollPos;

                    // Critical check: if scrollLeft didn't change as expected (positive scrollLeft RTL)
                    if (track.scrollLeft > 0) {
                        track.scrollLeft = track.scrollWidth - track.clientWidth - scrollPos;
                    }
                }

                animationFrame = requestAnimationFrame(step);
            };

            const startAutoScroll = () => {
                isPaused = false;
                lastTimestamp = performance.now(); // Sync timestamp
            };

            const stopAutoScroll = () => {
                isPaused = true;
            };

            // Start animation loop
            animationFrame = requestAnimationFrame(step);

            // Event Listeners for Pause/Resume
            // Desktop
            track.addEventListener('mouseenter', stopAutoScroll);
            track.addEventListener('mouseleave', startAutoScroll);

            // Mobile Interaction
            let touchTimeout;
            track.addEventListener('touchstart', () => {
                stopAutoScroll();
                if (touchTimeout) clearTimeout(touchTimeout);
            }, { passive: true });

            track.addEventListener('touchend', () => {
                // Sync internal scrollPos with manual scroll position
                if (!isRTL) {
                    scrollPos = track.scrollLeft % (track.scrollWidth / 2);
                } else {
                    scrollPos = Math.abs(track.scrollLeft) % (track.scrollWidth / 2);
                }
                touchTimeout = setTimeout(startAutoScroll, 2500);
            }, { passive: true });
        }

        /**
         * @description Opens the product detail view.
         * @param {string} key - Product unique key.
         */
        window.openFeaturedProduct = async function (key) {
            console.log(`[Featured] Opening product: ${key}`);

            // 1. Show Loading Indicator
            if (typeof Swal !== 'undefined') {
                const loadingTitle = window.langu('pv_loading_msg');
                Swal.fire({
                    title: (loadingTitle === 'pv_loading_msg') ? 'جاري التحميل...' : loadingTitle,
                    allowOutsideClick: false,
                    customClass: {
                        popup: 'swal-modern-mini-popup',
                        title: 'swal-modern-mini-title'
                    },
                    didOpen: () => { Swal.showLoading(); }
                });
            }

            try {
                // 2. Fetch Full Product Data from Server
                // This ensures we have Description, ImageName (full gallery), etc.
                let productData = null;
                if (typeof window.getProductByKey === 'function') {
                    productData = await window.getProductByKey(key);
                }

                // Fallback to local data if fetch fails
                if (!productData && window.selectedSearchProductsSet) {
                    for (let item of window.selectedSearchProductsSet) {
                        if (typeof item === 'object' && item.key === key) {
                            productData = item;
                            break;
                        }
                    }
                }

                if (!productData) {
                    throw new Error("Product not found");
                }

                // 3. Map Data using unified mapper
                // Handle migration for locally stored items
                if (!productData.ImageName && productData.img) {
                    productData.ImageName = productData.img;
                }

                const mappedData = typeof window.mapProductData === 'function'
                    ? window.mapProductData(productData)
                    : productData;

                // 4. Load View
                if (typeof window.loadProductView === 'function') {
                    window.loadProductView(mappedData, true);
                }

                if (typeof Swal !== 'undefined') Swal.close();

            } catch (error) {
                console.error("[Featured] Error opening product details:", error);
                if (typeof Swal !== 'undefined') {
                    Swal.fire(window.langu('gen_swal_error_title'), window.langu('pv_load_failed'), 'error');
                }
            }
        };

        // Expose to window to be called by home.html after data fetch
        window.initFeaturedModule = initFeaturedModule;
    })();</script>
