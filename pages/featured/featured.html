<link rel="stylesheet" href="/pages/featured/featured.css">
<div id="featured-products-section">
    <div class="featured-header" id="featured-header-container">
        <div class="featured-title section-header-custom" id="featured-title-wrapper">
            <div class="section-header-icon-container" id="featured-icon-container">
                <i class="fas fa-star" id="featured-title-icon"></i>
            </div>
            <span id="featured-title-text" data-lkey="featured_products_title">الأكثر رواجاً</span>
        </div>
    </div>

    <!-- Wrapper for Marquee/Scroll -->
    <div class="featured-wrapper" id="featured-scroller-wrapper" style="overflow: hidden; width: 100%;">
        <div id="featured-track" class="featured-scroller">
            <!-- Cards will be injected here -->
        </div>
    </div>
</div>

<script>
    /**
     * @file pages/featured/featured.js
     * @description Logic for displaying Featured Products (Favorites) banner using direct data binding via data attributes.
     * Matches the implementation pattern of main-category-gallery-content.
     */
    (function () {
        async function initFeaturedModule() {
            const container = document.getElementById('featured-products-section');
            const track = document.getElementById('featured-track');

            if (typeof window.applyAppTranslations === 'function') {
                window.applyAppTranslations();
            }

            // 1. Get Data from Global Cache
            let products = [];
            if (window.selectedSearchProductsSet && window.selectedSearchProductsSet.size > 0) {
                products = Array.from(window.selectedSearchProductsSet);
            } else {
                container.style.display = 'none';
                return;
            }

            // Filter valid products
            const validProducts = products.filter(p => typeof p === 'object' && (p.img || p.ImageName || p.image));

            if (validProducts.length === 0) {
                // Admin check logic
                const userStr = localStorage.getItem('loggedInUser');
                const user = userStr ? JSON.parse(userStr) : null;
                const isAdmin = user && (user.user_key === '682dri6b' || user.enableDevConsole);

                if (isAdmin) {
                    container.style.display = 'flex';
                    container.innerHTML = `
                        <div style="padding: 10px; text-align: center; border: 1px dashed #ccc; background: rgba(255,255,255,0.5); width: 100%; border-radius: 8px;">
                            <i class="fas fa-info-circle text-primary"></i>
                            <span style="font-size: 0.85rem; color: #555;">(Admin Only) No featured products selected. Check products in Search to add them.</span>
                        </div>
                    `;
                } else {
                    container.style.display = 'none';
                }
                return;
            }

            console.log(`[Featured] Displaying ${validProducts.length} items.`);
            container.style.display = 'flex';

            // 2. Build DOM Elements
            // Repeat items to fill enough track width if needed (min 15 items logic)
            const minItems = 15;
            let itemsToRender = [...validProducts];
            while (itemsToRender.length < minItems) {
                itemsToRender = [...itemsToRender, ...validProducts];
            }

            track.innerHTML = ''; // Clear existing content

            // Helper to create card element
            function createCard(product) {
                const card = document.createElement('div');
                card.className = 'featured-card';
                // Store full product data in attribute (JSON stringified)
                // This ensures the click handler has access to the exact object used for rendering
                card.setAttribute('data-product', JSON.stringify(product));

                // Image Handling
                const imgSource = product.img || product.ImageName || product.image;
                const imgUrl = imgSource
                    ? (typeof getPublicR2FileUrl === 'function' ? getPublicR2FileUrl(imgSource) : imgSource)
                    : 'images/placeholder.png';

                const priceVal = typeof product.price === 'number' ? product.price.toFixed(2) : product.price;
                const isService = (typeof isServiceCategory === 'function')
                    ? isServiceCategory(product.MainCategory, product.SubCategory)
                    : false;

                card.innerHTML = `
                    <div class="featured-img-container">
                        <img src="${imgUrl}" class="featured-img" loading="lazy" alt="${product.name || product.productName}">
                    </div>
                    <div class="featured-details">
                        <div class="featured-name">${product.name || product.productName}</div>
                        ${!isService ? `<div class="featured-price">${priceVal} ${window.langu('currency_egp')}</div>` : ''}
                    </div>
                `;
                return card;
            }

            // Create initial set of cards
            itemsToRender.forEach(p => {
                track.appendChild(createCard(p));
            });

            // Duplicate content for seamless infinite scroll
            // cloneNode(true) copies attributes including 'data-product'
            const children = Array.from(track.children);
            children.forEach(child => {
                track.appendChild(child.cloneNode(true));
            });

            // 3. Event Delegation for Clicks (Replaces inline onclick)
            track.addEventListener('click', function (e) {
                const card = e.target.closest('.featured-card');
                if (card) {
                    const rawData = card.getAttribute('data-product');
                    if (rawData) {
                        try {
                            const product = JSON.parse(rawData);
                            console.log('[Featured] Product clicked:', product);

                            // Use unified mapper logic matching main-category implementation
                            if (typeof window.mapProductData === 'function' && typeof window.loadProductView === 'function') {
                                const mapped = window.mapProductData(product);
                                window.loadProductView(mapped, true);
                            } else {
                                console.error('[Featured] Required global functions (mapProductData, loadProductView) missing.');
                            }

                        } catch (err) {
                            console.error('[Featured] Failed to parse product data:', err);
                        }
                    }
                }
            });

            // 4. Enable JS Auto-Scroll (Support Touch & Pause)
            // Logic remains unchanged from original implementation
            let animationFrame;
            let isPaused = false;
            let lastTimestamp = 0;
            const scrollSpeedPerSecond = 35; // pixels per second
            const isRTL = document.documentElement.dir === 'rtl';

            let scrollPos = 0;

            const step = (timestamp) => {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const elapsed = timestamp - lastTimestamp;
                lastTimestamp = timestamp;

                if (isPaused) {
                    animationFrame = requestAnimationFrame(step);
                    return;
                }

                const move = (scrollSpeedPerSecond * elapsed) / 1000;
                const halfWidth = track.scrollWidth / 2;

                if (!isRTL) {
                    scrollPos += move;
                    if (scrollPos >= halfWidth) scrollPos = 0;
                    track.scrollLeft = scrollPos;
                } else {
                    scrollPos += move;
                    if (scrollPos >= halfWidth) scrollPos = 0;
                    track.scrollLeft = -scrollPos;
                    if (track.scrollLeft > 0) {
                        track.scrollLeft = track.scrollWidth - track.clientWidth - scrollPos;
                    }
                }

                animationFrame = requestAnimationFrame(step);
            };

            const startAutoScroll = () => {
                isPaused = false;
                lastTimestamp = performance.now();
            };

            const stopAutoScroll = () => {
                isPaused = true;
            };

            // Start animation loop
            animationFrame = requestAnimationFrame(step);

            // Event Listeners for Pause/Resume
            track.addEventListener('mouseenter', stopAutoScroll);
            track.addEventListener('mouseleave', startAutoScroll);

            let touchTimeout;
            track.addEventListener('touchstart', () => {
                stopAutoScroll();
                if (touchTimeout) clearTimeout(touchTimeout);
            }, { passive: true });

            track.addEventListener('touchend', () => {
                requestAnimationFrame(() => {
                    const halfWidth = track.scrollWidth / 2;
                    let currentScroll = track.scrollLeft;

                    if (!isRTL) {
                        scrollPos = currentScroll % halfWidth;
                    } else {
                        scrollPos = Math.abs(currentScroll) % halfWidth;
                    }
                    lastTimestamp = 0;
                });

                if (touchTimeout) clearTimeout(touchTimeout);
                touchTimeout = setTimeout(startAutoScroll, 2500);
            }, { passive: true });
        }

        window.initFeaturedModule = initFeaturedModule;
    })();
</script>
