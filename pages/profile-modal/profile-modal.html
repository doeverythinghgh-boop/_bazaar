<!DOCTYPE html>
<html id="pm-root" lang="ar" dir="rtl">

<head>
  <meta id="pm-meta-charset" charset="UTF-8">
  <meta id="pm-meta-viewport" name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title id="pm-page-title">Suez Bazaar - تعديل الملف الشخصي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Core Behaviors -->
  <script src="/js/app-behavior.js"></script>
  <script id="pm-script-core-loader" src="/js/core-loader-bootstrap.js"></script>
  <script id="pm-script-auto-ids" src="/js/shared/auto-ids.js" defer></script>

  <!-- Shared Registration Styles (Single Source of Truth) -->
  <link rel="stylesheet" href="/pages/register/css/register-theme.css">
  <link rel="stylesheet" href="/pages/register/css/register-layout.css">
  <link rel="stylesheet" href="/pages/register/css/register-wizard.css">
  <link rel="stylesheet" href="/pages/register/css/register-ux.css">
  
  <!-- Step Specific Styles -->
  <link id="pm-link-register-animations-css" rel="stylesheet" href="/pages/register/register-animations.css">
  <link id="pm-link-register-avatar-css" rel="stylesheet" href="/pages/register/register-avatar.css">
  <link id="pm-link-register-covers-css" rel="stylesheet" href="/pages/register/register-covers.css">
  <link id="pm-link-register-roles-css" rel="stylesheet" href="/pages/register/register-roles.css">
  <link id="pm-link-register-popups-css" rel="stylesheet" href="/pages/register/register-popups.css">

  <!-- Voice & Search Shared -->
  <link rel="stylesheet" href="/style/search-filter-shared.css">
  <link rel="stylesheet" href="/style/voice-stt-shared.css">
  <script src="/js/shared/voice-stt-utility.js"></script>

  <!-- Wizard Engine & Logic (Shared with Registration) -->
  <script src="/pages/register/js/register-state.js" defer></script>
  <script src="/pages/register/js/register-error-manager.js" defer></script>
  <script src="/pages/register/js/register-analytics.js" defer></script>
  <script src="/pages/register/js/register-draft-manager.js" defer></script>
  <script src="/pages/register/js/register-navigation-guard.js" defer></script>
  <script src="/pages/register/js/register-ux-engine.js" defer></script>
  <script src="/pages/register/js/register-loader.js"></script>
  <script src="/pages/register/js/register-config.js" defer></script>
  <script src="/pages/register/js/register-elements.js" defer></script>
  <script src="/pages/register/js/register-map-helpers.js" defer></script>
  <script src="/pages/register/js/register-role-helpers.js" defer></script>
  <script src="/pages/register/js/register-business-helpers.js" defer></script>
  <script src="/pages/register/js/register-wizard-helpers.js" defer></script>
  <script src="/pages/register/js/register-submit-helpers.js" defer></script>
  <script src="/pages/register/js/register-phone-helpers.js" defer></script>
  <script src="/pages/register/js/register-validation-shared.js" defer></script>
  <script src="/pages/register/js/register-validation.js" defer></script>
  <script src="/js/shared/user-locations-client.js" defer></script>
  <script src="/js/shared/user-form-service.js" defer></script>
  <script src="/js/shared/user-service.js" defer></script>
  <script src="/js/shared/user-phone-ui.js" defer></script>
  <script src="/pages/register/js/register-locations-manager.js" defer></script>
  <script src="/js/shared/multi-links-client.js" defer></script>
  <script src="/pages/register/js/register-social-links-manager.js" defer></script>
  <script src="/pages/register/js/register-media-handlers.js" defer></script>
  <script src="/pages/register/js/register-role-handlers.js" defer></script>
  <script src="/pages/register/js/register-wizard-core.js" defer></script>
  <script src="/pages/register/js/register-wizard-sequence.js" defer></script>
  <script src="/pages/register/js/register-wizard-ui.js" defer></script>
  <script src="/pages/register/js/register-step-validation.js" defer></script>
  
  <!-- Profile Specific Bridge & Handlers -->
  <script src="/pages/profile-modal/js/profile-submit-handler.js" defer></script>
  <script src="/pages/profile-modal/js/profile-data-bridge.js" defer></script>
  <script src="/pages/profile-modal/js/profile-init.js" defer></script>

</head>

<body id="pm-app-body" class="register-active profile-wizard-active">

  <div id="header-injection-point"></div>

  <div id="reg-page-wrapper" class="register_page-wrapper">
    <div id="reg-container" class="register_container">
      <form id="register_form" novalidate>

        <!-- Role Selection (Identical to Register) -->
        <div id="reg-roles-group" class="reg-form-group visible">
          <div id="reg-roles-chips" class="roles-chips-container">
            <div id="reg-roles-scroller" class="roles-chips-wrapper">
              <label id="role-chip-buyer" class="role-chip">
                <input id="role-buyer-chk" type="checkbox" name="account_role" value="1" checked class="role-checkbox" data-js="role-buyer">
                <span class="role-chip-inner">
                  <span data-lkey="role_buyer">مشتري</span>
                </span>
              </label>
              <label id="role-chip-service" class="role-chip">
                <input id="role-service-chk" type="checkbox" name="account_role" value="32" class="role-checkbox" data-js="role-service">
                <span class="role-chip-inner">
                  <span data-lkey="role_service_provider">مقدم خدمة</span>
                </span>
              </label>
            </div>

            <div id="reg-role-description" class="register_role-description">
              <i id="reg-desc-role-icon" class="fas fa-user-check"></i>
              <p id="reg-desc-role-text" data-lkey="role_desc_buyer">يمكنك تصفح المنتجات والخدمات وإرسال الطلبات للتجار مباشرة.</p>
            </div>
          </div>
        </div>

        <!-- Wizard Steps Container -->
        <div id="reg-wizard-container" class="reg-wizard-container">
          <div id="reg-loading-indicator" style="text-align: center; padding: 60px;">
            <i class="fas fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--reg-primary);"></i>
            <p data-lkey="loading_status" style="margin-top: 15px; color: var(--reg-text-muted); font-weight: 600;"></p>
          </div>
        </div>

        <footer class="reg-wizard-footer">
          <div id="reg-step-meta" class="reg-step-meta">
            <div class="reg-step-status-line">
              <span id="reg-step-status-label" class="reg-step-status-label" data-lkey="reg_progress_unlocked_label">تم فتح</span>
              <div id="reg-step-counter" class="reg-step-counter">
                <span id="reg-current-step-num">1</span> / <span id="reg-total-steps-num">?</span>
              </div>
            </div>
            <div id="reg-step-hint" class="reg-step-hint" aria-live="polite"></div>
          </div>

          <button id="reg-submit-btn" type="submit" class="reg-nav-btn reg-btn-next reg-submit-btn-shell">
            <span data-lkey="profile_btn_save">حفظ التعديلات</span>
            <i class="fas fa-save"></i>
          </button>
        </footer>

      </form>
    </div>
  </div>

  <!-- Draft Recovery Banner -->
  <div id="reg-recover-banner" class="reg-recover-banner">
    <i class="fas fa-magic"></i>
    <span data-lkey="profile_msg_recovered">تم استرجاع تعديلاتك غير المحفوظة بنجاح</span>
  </div>

  <script id="pm-inline-init-script">
    document.addEventListener('DOMContentLoaded', async function () {
      if (typeof initAppTheme === 'function') initAppTheme();

      if (typeof loadIndexTranslations === 'function') {
        await window.loadIndexTranslations();
      }
      
      // Initialize the Profile-Wizard Bridge
      if (window.ProfileInit) {
          await window.ProfileInit.start();
      }
    });
  </script>
</body>

</html>
