el">وصف النشاط</label> <textarea id="register_business_bio"></textarea></div><div class="register_form-group"><label data-lkey="business_whatsapp_label">رابط واتساب</label> <input type="tel" id="register_business_whatsapp" placeholder="https://wa.me/..."></div><div class="register_seller-section" style="margin-top:20px"><button type="button" id="register_seller-options-btn" class="register_seller-btn" style="width:100%;padding:12px;background:#f0fdf4;border:1px dashed #10b981;color:#10b981;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;transition:all .3s"><i class="fas fa-store"></i> <span data-lkey="register_label_is_seller">خيارات البائع (توصيل / حد أدنى)</span></button> <input type="hidden" id="register_is-delivered" value="0"> <input type="hidden" id="register_limit-package" value="0"></div></div></div><button type="submit" class="button register_btn" data-lkey="register_btn_submit" style="margin-top:30px">إنشاء الحساب</button><div class="register_form-footer"><div id="index-contact-container" style="background-color:var(--bg-color-light)"></div><a href="#" id="register_goToLoginLink"><span data-lkey="register_login_question">لديك حساب بالفعل؟</span> <strong data-lkey="register_login_action">سجل الدخول</strong></a></div></form></div></div><script>document.addEventListener('DOMContentLoaded', async function () {
