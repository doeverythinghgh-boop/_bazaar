<script src="/LocalDatabasesProject/local-db.js"></script>
<script src="/js/early-error-bootstrap.js"></script>
<div id="reg-step-rating" class="reg-step reg-step-business" data-step-id="rating" data-step-order="6">
    <!-- Optional Rating Settings -->
    <div class="reg-optional-wrapper" id="reg-rating-optional-wrapper" data-required-mode="never">
        <button id="reg-rating-toggle-btn" type="button" class="reg-optional-toggle">
            <span id="reg-rating-toggle-label" class="toggle-label">
                <i id="reg-rating-toggle-icon" class="fas fa-star"></i>
                <span id="reg-rating-toggle-text" data-lkey="rating_settings_title">إعدادات التقييم (اختياري)</span>
            </span>
            <span id="reg-rating-optional-badge" class="reg-optional-badge" data-lkey="gen_optional">اختياري</span>
            <i id="reg-rating-toggle-chevron" class="fas fa-chevron-down"></i>
        </button>

        <div id="reg-rating-optional-content" class="reg-optional-content">
            <div id="reg-rating-settings-group" class="reg-form-group visible no-reveal"
                data-field-group="register_rating_enabled" style="margin-top: 15px;">
                <label id="reg-rating-enabled-label" class="reg-label"
                    style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
                    <input id="register_rating_enabled" type="checkbox" checked
                        style="width: 20px; height: 20px; accent-color: var(--reg-primary);">
                    <span id="reg-rating-enabled-text" data-lkey="rating_enable_label" style="font-size: 0.95rem;">تفعيل
                        تلقي التقييمات العامة</span>
                </label>

                <div id="register_rating_mode_group"
                    style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px; padding-right: 32px;">
                    <label id="reg-rating-mode-stars-comments-label" class="reg-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500;">
                        <input id="register_rating_mode_stars_comments" type="radio" name="register_rating_mode"
                            value="stars_comments" checked>
                        <span id="reg-rating-mode-stars-comments-text" data-lkey="rating_mode_stars_comments">نجوم +
                            تعليقات</span>
                    </label>
                    <label id="reg-rating-mode-stars-only-label" class="reg-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500;">
                        <input id="register_rating_mode_stars_only" type="radio" name="register_rating_mode"
                            value="stars_only">
                        <span id="reg-rating-mode-stars-only-text" data-lkey="rating_mode_stars_only">نجوم فقط</span>
                    </label>
                </div>
            </div>

            <div id="reg-product-rating-settings-group" class="reg-form-group visible no-reveal"
                data-field-group="register_product_rating_enabled" style="margin-top: 20px;">
                <label id="reg-product-rating-enabled-label" class="reg-label"
                    style="display: flex; align-items: center; gap: 12px; cursor: pointer;">
                    <input id="register_product_rating_enabled" type="checkbox" checked
                        style="width: 20px; height: 20px; accent-color: var(--reg-primary);">
                    <span id="reg-product-rating-enabled-text" data-lkey="product_rating_enable_label"
                        style="font-size: 0.95rem;">تفعيل تقييم الخدمات والخدمات</span>
                </label>

                <div id="register_product_rating_mode_group"
                    style="margin-top: 10px; display: flex; flex-direction: column; gap: 10px; padding-right: 32px;">
                    <label id="reg-prod-rating-mode-stars-comments-label" class="reg-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500;">
                        <input id="register_product_rating_mode_stars_comments" type="radio"
                            name="register_product_rating_mode" value="stars_comments" checked>
                        <span id="reg-prod-rating-mode-stars-comments-text"
                            data-lkey="product_rating_mode_stars_comments">نجوم + تعليقات</span>
                    </label>
                    <label id="reg-prod-rating-mode-stars-only-label" class="reg-label"
                        style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500;">
                        <input id="register_product_rating_mode_stars_only" type="radio"
                            name="register_product_rating_mode" value="stars_only">
                        <span id="reg-prod-rating-mode-stars-only-text" data-lkey="product_rating_mode_stars_only">نجوم
                            فقط</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
