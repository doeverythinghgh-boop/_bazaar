<!DOCTYPE html><html id="index-html-root" lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content"><title>Suez Bazaar - لوحة التحكم</title><script src="/js/core-loader.js"></script><link rel="stylesheet" href="/style/user-dashboard.css"><script src="/js/user-dashboard.js" defer="defer"></script></head><body id="index-app-body"><div id="header-injection-point"></div><div id="dash-profile-modal-container" class="modal"></div><div id="index-user-container" style="background-color:var(--bg-color-light)"></div><div id="index-productAdd-container" style="background-color:var(--bg-color-light)"></div><div id="index-productEdit-container" style="background-color:var(--bg-color-light)"></div><div id="index-cardPackage-container" style="background-color:var(--bg-color-light)"></div><div id="index-myProducts-container" style="background-color:var(--bg-color-light)"></div><div id="index-contact-container" style="background-color:var(--bg-color-light)"></div><div id="index-salesMovement-container" style="background-color:var(--bg-color-light)"></div><div id="index-orderPhoto-container" style="background-color:var(--bg-color-light)"></div><div id="dash-user-avatar-container" class="dash-avatar-container"><img id="dash-user-avatar" src="" alt="User Avatar" style="display:none"> <i id="dash-user-avatar-placeholder" class="fas fa-user-circle"></i></div><h2 id="dash-welcome-message"></h2><div id="dash-gifts-container" class="dash-featured-container"><button id="index-gifts-btn" class="dash-button"><i id="index-gifts-icon" class="fas fa-gift"></i> <span id="index-gifts-text" data-lkey="dash_gifts">هدايا</span></button></div><div id="dash-seller-section" class="dash-seller-frame"><button id="dash-add-product-btn" class="dash-button"><i id="dash-add-product-icon" class="fas fa-plus"></i> <span id="dash-add-product-text" data-lkey="dash_add_product">إضافة منتج</span></button> <button id="dash-view-my-products-btn" class="dash-button"><i id="dash-view-my-products-icon" class="fas fa-archive"></i> <span id="dash-view-my-products-text" data-lkey="dash_my_products">منتجاتي</span></button></div><div id="dash-action-buttons" class="dash-action-buttons"><button id="dash-admin-panel-btn" class="dash-button"><i id="dash-admin-panel-icon" class="fas fa-user-shield"></i> <span id="dash-admin-panel-text" data-lkey="dash_admin_panel">لوحة المسؤول</span></button></div><div class="floating-actions-container"><button id="index-settings-btn" class="floating-btn-base" data-lkey-title="dash_settings_title" title="الإعدادات"><i id="index-settings-icon" class="fas fa-cog"></i></button> <button id="dash-logout-btn-alt" class="floating-btn-base" data-lkey-title="dash_logout" title="تسجيل الخروج"><i id="dash-logout-icon" class="fas fa-sign-out-alt"></i></button></div><script>document.addEventListener('DOMContentLoaded', async function () {
            // 1. Initialize Theme
            if (typeof initAppTheme === 'function') initAppTheme();

            // 2. Translations (CRITICAL: Load before header)
            if (typeof loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            // 3. Initialize Session (Updates Header Username)
            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
            }

            // 4. Header & Navigation (Injects DOM elements)
            if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                await AppHeader.init('header-injection-point', 'index-login-btn');
            }

            // 5. UX \u0026 UI States
            if (typeof checkImpersonationMode === 'function') checkImpersonationMode();
            if (typeof runHeaderScrollTutorial === 'function') window.runHeaderScrollTutorial();
            if (typeof applyAppTranslations === 'function') {
                applyAppTranslations();
            }

            // 6. Initialize Dashboard View
            if (typeof updateViewForLoggedInUser === 'function') {
                updateViewForLoggedInUser();
            }
        });</script></body></html>
