<!DOCTYPE html><html id="index-html-root" lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>عرض الخدمة - Suez Bazaar</title><script src="../../js/core-loader.js"></script><link rel="stylesheet" href="productView2.css"><script src="js/view2_config.js" defer="defer"></script><script src="js/view2_utils.js" defer="defer"></script><script src="js/view2_slider.js" defer="defer"></script><script src="js/view2_ui.js" defer="defer"></script><script src="js/view2_submit.js" defer="defer"></script><script src="js/view2_init.js" defer="defer"></script></head><body style="background-color:var(--bg-color-light)"><div id="pwa-splash-screen" class="splash-screen"></div><div id="header-injection-point"></div><div class="pv2_modal_content" id="pv2_modal_content"><div id="pv2_slider" class="pv2_slider-container"><div class="pv2_slider-track" id="pv2_slider_track"></div><div class="pv2_slider-dots" id="pv2_slider_dots"></div><button class="pv2_slider-nav prev" id="pv2_slider_prev" aria-label="Previous Slide"><i class="fas fa-chevron-left"></i></button> <button class="pv2_slider-nav next" id="pv2_slider_next" aria-label="Next Slide"><i class="fas fa-chevron-right"></i></button></div><div class="pv2_details" id="pv2_details_container"><h3 id="pv2_name" style="text-align:center;margin-bottom:1rem;color:var(--text-color-dark,#222)"></h3><div class="pv2_description_box" id="pv2_description_container"><h4 id="pv2_description_header"><i class="fas fa-file-alt"></i> <span data-lkey="view2_desc_header">وصف الخدمة</span></h4><p id="pv2_description_text"></p></div><div class="pv2_seller_message_box" id="pv2_seller_message_container"><h4 id="pv2_seller_message_header"><i class="fas fa-comment-dots" id="pv2_seller_message_icon"></i> <span data-lkey="view2_seller_msg_header">رسالة من مقدم الخدمة</span></h4><p id="pv2_seller_message_text"></p></div><div class="pv2_order_box" id="pv2_order_box"><h4><i class="fas fa-paper-plane"></i> <span data-lkey="view2_order_box_title">بيانات الارسال ( اضف ملاحظاتك او صور او كلاهما لوصف طلبك بدقة )</span></h4><textarea id="pv2_note" maxlength="300" placeholder="أضف ملاحظاتك ووصف دقيق لطلبك (بحد أقصى 300 حرف)" data-lkey-placeholder="view2_note_placeholder"></textarea><div class="pv2_uploader" id="pv2_uploader_area"><div style="font-size:.8rem;color:#888;margin-top:5px" data-lkey="view2_upload_hint">(بحد أقصى 4 صور - 5 ميجابايت لكل صورة)</div><input type="file" id="pv2_fileInput" accept="image/*" multiple="multiple" style="display:none"><div class="pv2_uploader_actions"><div class="pv2_uploader_btn" id="pv2_pickImgBtn" title="اختر صور" data-lkey-title="gen_btn_pick_images"><i class="fas fa-images"></i></div><div class="pv2_uploader_btn" id="pv2_camBtn" title="الكاميرا" data-lkey-title="gen_btn_take_photo"><i class="fas fa-camera"></i></div></div><div class="pv2_previews" id="pv2_previews"></div></div><button id="pv2_sendBtn" class="pv2_send_btn"><i class="fas fa-paper-plane"></i> <span data-lkey="gen_btn_send_order">إرسال الطلب</span></button></div></div></div><script>document.addEventListener('DOMContentLoaded', async function () {
      // 1. Initialize Theme (Dark Mode support)
      if (typeof initAppTheme === 'function') initAppTheme();

      // 2. Initialize Translations (CRITICAL: Load before session and header)
      if (typeof loadIndexTranslations === 'function') {
        await window.loadIndexTranslations();
      }

      // 3. Initialize Session (Syncs UI, depends on translations)
      if (typeof SessionManager !== 'undefined') {
        SessionManager.init();
      }

      // 4. Load Core Data
      if (typeof fetchAppCategories === 'function') await fetchAppCategories();

      // 5. Initialize Header (Depends on translations)
      if (typeof AppHeader !== 'undefined' && AppHeader.init) {
        await AppHeader.init('header-injection-point', 'index-home-btn');
      }

      // 6. Initialize Page Content (After translations)
      if (typeof pv2_initPage === 'function') {
        pv2_initPage();
      }
    });</script></body></html>
