<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حذف الحساب على Suez Bazaar</title><style>body{font-family:sans-serif;background-color:transparent;color:#333;margin:0;padding:0;line-height:1.6}.container{padding:20px}h1{color:#2c3e50;text-align:center}.highlight{color:#e74c3c;font-weight:700}</style></head><body><div class="container"><h1>حذف الحساب على Suez Bazaar</h1><p>يمكنك حذف حسابك وجميع البيانات المرتبطة به بسهولة. للقيام بذلك، اتبع الخطوات التالية:</p><ol><li>افتح التطبيق وانتقل إلى صفحة <span class="highlight">حسابي</span>.</li><li>اختر <span class="highlight">إعدادات الحساب</span>.</li><li>ابحث عن خيار <span class="highlight">حذف الحساب</span> واضغط عليه.</li></ol><p><span class="highlight">تنويه:</span> بعد حذف الحساب، لن تتمكن من استرجاع هذه البيانات نهائياً.</p></div></body></html>
