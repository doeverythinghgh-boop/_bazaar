<!DOCTYPE html>
<html lang="ar" dir="rtl" id="clothing-sizes-html-root">
<head id="pageHead">
  
  <script src="/LocalDatabasesProject/local-db.js"></script>
  <script src="/js/early-error-bootstrap.js"></script>
  <meta charset="UTF-8" id="metaCharset">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" id="metaViewport">
  <title data-lkey="cs_main_title" id="pageTitle">📏 موسوعة مقاسات السوق المصري</title>
  
  <!-- Core Loader (Required for translations and global behavior) -->
  <script src="/js/app-behavior.js" id="scriptAppBehavior"></script>
  <script src="/js/core-loader-bootstrap.js" id="scriptCoreLoader"></script>

  <!-- ملفات التنسيق المنفصلة -->
  <link rel="stylesheet" href="styles-layout.css" id="linkStylesLayout">
  <link rel="stylesheet" href="styles-table.css" id="linkStylesTable">
  <link rel="stylesheet" href="styles-svg.css" id="linkStylesSvg">
</head>
<body id="pageBody">
<div class="container" id="mainContainer">
  <!-- نظام التبويبات -->
  <div class="tabs" id="categoryTabs">
    <button class="tab-btn active" data-tab="men" id="tabBtnMen" data-lkey="cs_tab_men">👕 رجالي</button>
    <button class="tab-btn" data-tab="women" id="tabBtnWomen" data-lkey="cs_tab_women">🧕 حريمي</button>
    <button class="tab-btn" data-tab="kids" id="tabBtnKids" data-lkey="cs_tab_kids">🧸 أطفال</button>
    <button class="tab-btn" data-tab="bedding" id="tabBtnBedding" data-lkey="cs_tab_bedding">🛏️ مفروشات</button>
    <button class="tab-btn" data-tab="shoes" id="tabBtnShoes" data-lkey="cs_tab_shoes">👟 أحذية</button>
  </div>

  <!-- لوحة المحتوى الرئيسي -->
  <div class="content-panel" id="contentPanel">
    <!-- منطقة الرسم التوضيحي -->
    <div class="illustration-box" id="illustrationBox">
      <div class="svg-container" id="svgContainer">
        <!-- يتم توليد الـ SVG هنا بواسطة logic-svg-engine.js -->
      </div>
    </div>

    <!-- منطقة جداول البيانات -->
    <div class="table-box" id="tableBox">
      <div class="table-title" id="tableTitle">📋 مقاسات الملابس الرجالي</div>
      <div id="tableWrapper">
        <!-- يتم توليد الجدول هنا بواسطة logic-table-manager.js -->
      </div>
    </div>
  </div>
</div>

<!-- ملفات البيانات المنفصلة -->
<script src="data-men.js" id="scriptDataMen"></script>
<script src="data-women.js" id="scriptDataWomen"></script>
<script src="data-kids.js" id="scriptDataKids"></script>
<script src="data-extras.js" id="scriptDataExtras"></script>
<script src="data-main.js" id="scriptDataMain"></script>

<!-- ملفات المنطق البرمجي المنفصلة -->
<script src="svg-helpers.js" id="scriptSvgHelpers"></script>
<script src="svg-drawers.js" id="scriptSvgDrawers"></script>
<script src="svg-engine-main.js" id="scriptSvgEngineMain"></script>
<script src="logic-table-manager.js" id="scriptLogicTableManager"></script>
<script src="logic-main-app.js" id="scriptLogicMainApp"></script>

<script id="scriptInit">
  /**
   * Required for build system security check: ensures translations are loaded properly.
   */
  document.addEventListener('DOMContentLoaded', async function () {
    if (typeof loadIndexTranslations === 'function') {
      await window.loadIndexTranslations();
    }
  });
</script>

</body>
</html>
