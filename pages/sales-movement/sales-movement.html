            try {

                if (typeof loadIndexTranslations === 'function') {

                    await AppHeader.init('header-injection-point', 'index-sales-movement-btn');

                if (window.applyAppTranslations) window.applyAppTranslations();

                // 5. Initialize Page specific logic
                if (typeof salesMovement_loadUserTypeSelection === 'function') {
                    salesMovement_loadUserTypeSelection();
                }



            } catch (error) {
                console.error('[SalesMovement] Page initialization failed:', error);
            }
        });</script></body></html>
