<!DOCTYPE html><html id="index-html-root" lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Suez Bazaar - الرئيسية</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Suez Bazaar - الرئيسية</title><script src="/js/core-loader.js"></script><script src="/pages/advertisement/advertisement.js" defer="defer"></script><script src="/pages/categories/categories.js" defer="defer"></script></head><body style="background-color:var(--bg-color-light)"><div id="header-injection-point"></div><div id="home-main-wrapper" style="background-color:var(--bg-color-light)"><div id="loader-container" class="loader"></div><div class="section-header-custom1" id="home-ads-header" style="display:none"></div><div id="advertisement" style="background-color:var(--bg-color-light)"></div><div id="featured-products" style="background-color:transparent"></div><div class="section-header-custom" id="home-categories-header" style="display:none"><div class="section-header-icon-container" id="home-categories-icon-container"><i class="fas fa-store" id="home-categories-icon"></i></div><span id="home-categories-title-text" data-lkey="home_categories_title">أسواق السويس</span></div><div id="categories00" style="background-color:var(--bg-color-light)"></div></div><script>/**
     * @function home_initContent
     * @description Fetches and initializes the dynamic parts of the home page.
     */
    async function home_initContent() {
      const loaderElement = document.getElementById("loader-container");
      const contentElements = [
        document.getElementById("advertisement"),
        document.getElementById("featured-products"),
        document.getElementById("categories00"),
      ];

      const originalDisplays = new Map();
      contentElements.forEach((el) => {
        originalDisplays.set(el, el.style.display || "block");
        el.style.display = "none";
      });
      if (loaderElement) loaderElement.style.display = "block";

      try {
        // Step 1: Load parts using absolute paths
        await Promise.all([
          loader("/pages/advertisement/advertisement.html", "advertisement", 0),
          loader("/pages/featured/featured.html", "featured-products", 100),
          loader("/pages/categories/categories.html", "categories00", 300),
        ]);

        // Step 2: Initialize modules
        if (typeof initAdverModule === 'function') {
          initAdverModule(document.getElementById("advertisement-section"));
        }

        if (typeof window.initSelectedProductsModule === 'function') {
          await window.initSelectedProductsModule();
          if (typeof window.initFeaturedModule === 'function') {
            window.initFeaturedModule();
          }
        }

        if (typeof categories_loadCategoriesAsTable === 'function') {
          categories_loadCategoriesAsTable();
        }

        // Step 3: UI Adjustments
        const adsHeader = document.getElementById('home-ads-header');
        const catHeader = document.getElementById('home-categories-header');
        if (adsHeader) adsHeader.style.display = 'flex';
        if (catHeader) catHeader.style.display = 'flex';

        if (typeof window.applyAppTranslations === 'function') {
          window.applyAppTranslations();
        }

        contentElements.forEach((el) => {
          el.style.display = originalDisplays.get(el);
        });

        // Step 4: Version Footer
        try {
          const vUrl = `/v.json?v=${Date.now()}`;
          const versionResponse = await fetch(vUrl);
          if (versionResponse.ok) {
            const versionData = await versionResponse.json();
            const footer = document.createElement('div');
            footer.id = 'app-footer';
            footer.style.cssText = 'text-align: center; padding: 10px; font-size: 0.7rem; color: #888; width: 100%; border-top: 1px solid #eee; margin-top: 20px; background-color: #fafafa; font-family: sans-serif;';
            footer.innerHTML = `&copy; 2025 Suez Bazaar <span style="margin: 0 8px;">•</span> v${versionData.version}`;
            document.getElementById('home-main-wrapper').appendChild(footer);
          }
        } catch (vErr) { console.warn("[Home] Footer error:", vErr); }

      } catch (error) {
        console.error("❌ [Home] Initialization failed:", error);
      } finally {
        if (loaderElement) loaderElement.style.display = "none";
      }
    }

    document.addEventListener('DOMContentLoaded', async function () {
      // 1. Theme
      if (typeof initAppTheme === 'function') window.initAppTheme();

      // 2. Initialize Translations (CRITICAL: Load before session and header)
      if (typeof loadIndexTranslations === 'function') {
        await window.loadIndexTranslations();
      }

      // 3. Initialize Session (Syncs UI, depends on translations)
      if (typeof SessionManager !== 'undefined') {
        SessionManager.init();
      }

      // 4. Initialize Data
      if (typeof fetchAppCategories === 'function') await fetchAppCategories();

      // 5. Initialize Header (Depends on translations)
      if (typeof AppHeader !== 'undefined' && AppHeader.init) {
        await AppHeader.init('header-injection-point', 'index-home-btn');
      }

      if (typeof applyAppTranslations === 'function') applyAppTranslations();

      // 6. PWA & Notifications (Service Worker registration)
      if (typeof setupFCM === 'function') {
        setupFCM();
      }

      // 7. Bootstrap content
      await home_initContent();
    });</script></body></html>
