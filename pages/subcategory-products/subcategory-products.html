<!DOCTYPE html><html id="sub-products-root" lang="ar" dir="rtl"><head id="sub-products-head"><script src="/js/early-error-bootstrap.js"></script><meta id="sub-products-meta-charset" charset="UTF-8"><meta id="sub-products-meta-viewport" name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title id="sub-products-page-title">منتجات التصنيف - Suez Bazaar</title><script id="sub-products-app-behavior" src="/js/app-behavior.js"></script><script id="sub-products-core-loader" src="/js/core-loader-bootstrap.js"></script><link id="sub-products-styles" rel="stylesheet" href="/pages/subcategory-products/subcategory-products.css"><script id="tools-text" src="/js/tools-text.js" defer="defer"></script><script id="sub-products-script" src="/pages/subcategory-products/subcategory-products.js" defer="defer"></script></head><body id="sub-products-body" style="background-color:var(--bg-color-light)"><div id="header-injection-point"></div><main id="sub-products-main" class="sub-products-page"><header id="sub-products-header" class="sub-products-header" style="display:none"><div id="sub-products-icon-box" class="sub-products-icon-box"><i id="sub-products-icon" class="fas fa-tag"></i></div><div id="sub-products-title-group" class="sub-products-title-group"><h1 id="sub-products-category-name">...</h1><div class="sub-products-search-container" id="sub-products-search-container" style="position:relative;margin-top:10px;width:100%;display:none"><input type="text" id="sub-products-search-input" class="sub-products-search-input" placeholder="🔍 بحث..." autocomplete="off" style="width:100%;padding:8px 35px 8px 12px;border:1px solid var(--border-color);border-radius:8px;background:var(--bg-color-white);font-family:inherit;font-size:.95rem;outline:0;box-sizing:border-box;color:var(--text-color)"> <i id="sub-products-search-clear" class="fas fa-times-circle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-color-light);font-size:1rem;cursor:pointer;display:none"></i></div></div></header><div id="sub-products-grid" class="sub-products-grid"><div id="sub-products-loader" class="loader" style="grid-column:1/-1;margin:40px auto"></div></div></main><script id="sub-products-init-script">document.addEventListener('DOMContentLoaded', async function () {
            try {
                // 1. Theme
                if (typeof initAppTheme === 'function') window.initAppTheme();

                // 2. Translations
                if (typeof loadIndexTranslations === 'function') {
                    await window.loadIndexTranslations();
                }

                // 3. Session
                if (typeof SessionManager !== 'undefined') {
                    SessionManager.init();
                }

                // 4. App Header
                if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                    await AppHeader.init('header-injection-point', 'index-home-btn');
                }

                // 5. Apply Global translations
                if (window.applyAppTranslations) window.applyAppTranslations();

                // 6. Initialize Page Data (Wait for translations first)
                if (typeof initSubProductsPage === 'function') {
                    await initSubProductsPage();
                }

            } catch (error) {
                console.error('[SubProducts] Page initialization failed:', error);
            }
        });</script></body></html>
