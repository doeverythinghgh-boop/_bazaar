<!DOCTYPE html><html id="sub-products-root" lang="ar" dir="rtl"><head id="sub-products-head"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title id="sub-products-page-title">منتجات التصنيف - Suez Bazaar</title><script src="/js/app-behavior.js"></script><script id="sub-products-core-loader" src="/js/core-loader.js"></script><link id="sub-products-styles" rel="stylesheet" href="/pages/subcategory-products/subcategory-products.css"><script id="sub-products-script" src="/pages/subcategory-products/subcategory-products.js" defer="defer"></script></head><body id="sub-products-body" style="background-color:var(--bg-color-light)"><div id="header-injection-point"></div><main id="sub-products-main" class="sub-products-page"><header id="sub-products-header" class="sub-products-header" style="display:none"><div id="sub-products-icon-box" class="sub-products-icon-box"><i id="sub-products-icon" class="fas fa-tag"></i></div><div id="sub-products-title-group" class="sub-products-title-group"><h1 id="sub-products-category-name">...</h1><p id="sub-products-count-text">...</p></div></header><div id="sub-products-grid" class="sub-products-grid"><div class="loader" style="grid-column:1/-1;margin:40px auto"></div></div></main><script id="sub-products-init-script">document.addEventListener('DOMContentLoaded', async function () {
            try {
                // 1. Theme
                if (typeof initAppTheme === 'function') window.initAppTheme();

                // 2. Translations
                if (typeof loadIndexTranslations === 'function') {
                    await window.loadIndexTranslations();
                }

                // 3. Session
                if (typeof SessionManager !== 'undefined') {
                    SessionManager.init();
                }

                // 4. App Header
                if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                    await AppHeader.init('header-injection-point', 'index-home-btn');
                }

                // 5. Apply Global translations
                if (window.applyAppTranslations) window.applyAppTranslations();

            } catch (error) {
                console.error('[SubProducts] Page initialization failed:', error);
            }
        });</script></body></html>
