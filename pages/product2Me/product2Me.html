<!DOCTYPE html><html id="index-html-root" lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title></title><script src="/js/app-behavior.js"></script><script src="/js/core-loader.js"></script><link rel="stylesheet" href="/pages/product2Me/product2Me.css"></head><body id="product-2me-page"><p class="splash-loading-text" id="p2m-splash-loading"></p><div id="header-injection-point"></div><div class="p2m-products-container" id="p2m-products-container"><div class="p2m-search-container" id="p2m-search-container"><table id="p2m-search-table" style="width:100%;border-spacing:10px;table-layout:fixed"><tbody id="p2m-search-tbody"><tr id="p2m-filters-row"><td id="p2m-main-category-cell"><div class="p2m-form-group" id="p2m-main-category-group"><i class="fas fa-layer-group p2m-filter-icon" id="p2m-main-category-icon"></i> <select class="p2m-form-select" id="main-category-filter" aria-label=""><option value="" id="p2m-main-category-default"></option></select></div></td><td id="p2m-sub-category-cell"><div class="p2m-form-group" id="p2m-sub-category-group"><i class="fas fa-tags p2m-filter-icon" id="p2m-sub-category-icon"></i> <select class="p2m-form-select" id="sub-category-filter" aria-label=""><option value="" id="p2m-sub-category-default"></option></select></div></td></tr><tr id="p2m-search-input-row"><td colspan="2" id="p2m-search-input-cell"><div class="p2m-input-container" id="p2m-input-container" style="padding-right:0"><i class="fas fa-search p2m-input-icon" id="p2m-search-icon" aria-hidden="true"></i> <input type="search" id="search-input" placeholder="" autocomplete="off"></div></td></tr><tr id="p2m-action-row"><td id="p2m-sort-cell"><div class="p2m-form-group" id="p2m-sort-group"><i class="fas fa-sort-amount-down p2m-filter-icon" id="p2m-sort-icon"></i> <select class="p2m-form-select" id="sort-filter" aria-label=""><option value="default" id="p2m-sort-default"></option><option value="price-asc" id="p2m-sort-price-asc"></option><option value="price-desc" id="p2m-sort-price-desc"></option></select></div></td><td id="p2m-search-btn-cell"><button type="button" class="p2m-search-btn" id="search-btn" aria-label="" style="width:100%;height:50px;border-radius:50px"><i class="fas fa-search" id="p2m-search-btn-icon"></i></button></td></tr></tbody></table></div><div class="p2m-products-grid" id="products-grid"></div><div class="p2m-loading-state" id="loading-state" style="display:none"><i class="fas fa-spinner fa-spin" id="p2m-loading-icon"></i><p id="p2m-loading-text"></p></div><div class="p2m-empty-state" id="empty-state" style="display:none"><i class="fas fa-box-open" id="p2m-empty-icon"></i><p id="p2m-empty-text-1"></p><p id="p2m-empty-text-2"></p></div></div><script src="product2Me-text.js"></script><script src="product2Me.js"></script><script>function applyProduct2MeStaticTranslations() {
            const pageTitle = p2mStaticText("dash_my_products", "My Products");
            document.title = pageTitle + " - Suez Bazaar";

            const root = document.documentElement;
            const lang = (localStorage.getItem("app_language") || window.app_language || "ar") === "en" ? "en" : "ar";
            root.lang = lang;
            root.dir = lang === "en" ? "ltr" : "rtl";

            const map = [
                ["p2m-splash-loading", "loading_status", "Loading..."],
                ["p2m-main-category-default", "search_modal_main_category_default", "All Main Categories"],
                ["p2m-sub-category-default", "search_modal_sub_category_default", "All Sub Categories"],
                ["p2m-sort-default", "search_modal_sort_default", "Default Sorting"],
                ["p2m-sort-price-asc", "search_modal_sort_price_asc", "Price: Low to High"],
                ["p2m-sort-price-desc", "search_modal_sort_price_desc", "Price: High to Low"],
                ["p2m-loading-text", "search_loading_status", "Loading products..."],
                ["p2m-empty-text-1", "no_products", "No products to display"],
                ["p2m-empty-text-2", "p2m_empty_subtitle", "Add your first product to get started"]
            ];

            map.forEach(([id, key, fallback]) => {
                const element = document.getElementById(id);
                if (element) {
                    element.textContent = p2mStaticText(key, fallback);
                }
            });

            const searchInput = document.getElementById("search-input");
            if (searchInput) {
                searchInput.placeholder = p2mStaticText("search_modal_input_placeholder", "Search products or services...");
            }

            const mainFilter = document.getElementById("main-category-filter");
            if (mainFilter) {
                mainFilter.setAttribute("aria-label", p2mStaticText("search_modal_main_category_label", "Main Category"));
            }

            const subFilter = document.getElementById("sub-category-filter");
            if (subFilter) {
                subFilter.setAttribute("aria-label", p2mStaticText("search_modal_sub_category_label", "Sub Category"));
            }

            const sortFilter = document.getElementById("sort-filter");
            if (sortFilter) {
                sortFilter.setAttribute("aria-label", p2mStaticText("search_modal_sort_label", "Sort By"));
            }

            const searchButton = document.getElementById("search-btn");
            if (searchButton) {
                searchButton.setAttribute("aria-label", p2mStaticText("search_modal_search_btn_aria", "Search"));
            }
        }

        document.addEventListener("DOMContentLoaded", async function () {
            try {
                if (typeof initAppTheme === "function") initAppTheme();
                else if (typeof initTheme === "function") initTheme();

                if (typeof window.loadIndexTranslations === "function") {
                    await window.loadIndexTranslations();
                }

                applyProduct2MeStaticTranslations();

                if (typeof SessionManager !== "undefined" && SessionManager.init) SessionManager.init();

                if (typeof AppHeader !== "undefined" && AppHeader.init) {
                    await AppHeader.init("header-injection-point");
                }

                if (typeof initializeProduct2Me === "function") {
                    await initializeProduct2Me();
                }

                setTimeout(() => {
                    if (typeof hideSplashScreen === "function") {
                        hideSplashScreen();
                    }
                }, 600);
            } catch (error) {
                console.error("[P2M] Error during initialization:", error);
                if (typeof hideSplashScreen === "function") hideSplashScreen();
            }
        });</script></body></html>
