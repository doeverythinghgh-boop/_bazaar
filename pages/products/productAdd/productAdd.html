n="0"></div><div class="add1_product_modal__form_group" id="add1_group_price"><label for="add1_product_price" class="add1_product_modal__label" id="add1_label_price"><i class="fas fa-dollar-sign" id="add1_icon_price"></i> <span data-lkey="add1_label_price">السعر الحالي</span></label> <input type="number" inputmode="decimal" step="0.01" id="add1_product_price" name="product-price" class="add1_product_modal__input" placeholder="0.00"></div><div class="add1_product_modal__form_group" id="add1_group_original_price"><label for="add1_original_price" class="add1_product_modal__label" id="add1_label_original_price"><i class="fas fa-tag" id="add1_icon_original_price"></i> <span data-lkey="add1_label_original_price">السعر قبل الخصم</span></label> <input type="number" inputmode="decimal" step="0.01" id="add1_original_price" name="original-price" class="add1_product_modal__input" placeholder="ادخل رقم" data-lkey-placeholder="add1_placeholder_number"></div><div class="add1_product_modal__form_group" id="add1_group_real_price"><label for="add1_real_price" class="add1_product_modal__label" id="add1_label_real_price"><i class="fas fa-coins" id="add1_icon_real_price"></i> <span data-lkey="add1_label_real_price">سعر التطبيق</span></label> <input type="number" inputmode="decimal" step="0.01" id="add1_real_price" name="real-price" class="add1_product_modal__input" placeholder="ادخل رقم" data-lkey-placeholder="add1_placeholder_number"></div></div><div class="add1_product_modal__form_group add1_product_modal__form_group--checkbox" id="add1_group_heavy_load"><label for="add1_heavy_load" class="add1_product_modal__label add1_product_modal__label--checkbox"><input type="checkbox" id="add1_heavy_load" name="heavy-load" class="add1_product_modal__checkbox"> <span><i class="fas fa-truck-moving" id="add1_icon_heavy_load"></i> <span data-lkey="add1_checkbox_heavy_load">يحتاج إلى سيارة في التوصيل</span></span></label></div></div></div></form><div class="add1_product_modal__submit_container" id="add1_submit_container" style="margin-top:20px"><button type="submit" form="add1_product_form" class="add1_btn add1_btn_primary" id="add1_btn_submit"><span data-lkey="add1_submit_btn_initial">اضف المنتج الآن</span></button></div></div><div id="add1_camera_modal_container" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:1000;justify-content:center;align-items:center"></div><script src="../shared/product-debug-console.js" defer="defer"></script><script src="../shared/product-draft-manager.js" defer="defer"></script><script src="js/add1_config.js" defer="defer"></script><script src="../shared/category/product-category-page-shared.js" defer="defer"></script><script src="../shared/category/product-category-page-form.js" defer="defer"></script><script src="../shared/category/product-category-page-apply.js" defer="defer"></script><script src="../shared/form/product-form-core.js" defer="defer"></script><script src="../shared/form/product-form-ui-core.js" defer="defer"></script><script src="../shared/form/product-form-dom-core.js" defer="defer"></script><script src="../shared/form/product-form-submit-core.js" defer="defer"></script><script src="js/add1_utils.js" defer="defer"></script><script src="js/add1_image.js" defer="defer"></script><script src="js/add1_ui_dom.js" defer="defer"></script><script src="js/add1_ui_category.js" defer="defer"></script><script src="js/add1/add1_validation.js" defer="defer"></script><script src="js/add1/add1_ui.js" defer="defer"></script><script src="js/add1/add1_handler.js" defer="defer"></script><script src="js/add1/add1_ui_helpers.js" defer="defer"></script><script src="js/add1/add1_ui_events.js" defer="defer"></script><script src="js/add1/add1_main.js" defer="defer"></script><script>document.addEventListener('DOMContentLoaded', async function () {
            const params = new URLSearchParams(window.location.search);
            if (!params.get('provider_key')) {
                console.error('[ProductAdd] Missing provider_key in URL. Redirecting to home.');
                window.location.replace('/');
                return;
            }

            const urlMainId = params.get('MainCategory');
            const urlSubId = params.get('SubCategory');
            // Initialize ProductStateManager with URL params if available immediately.
            if (typeof ProductStateManager !== 'undefined' && urlMainId && urlSubId) {
                ProductStateManager.setSelectedCategories(urlMainId, urlSubId);
            }

            window.ProductDebugConsole?.log('productAdd', 'dom-content-loaded');
            // 1. Theme Init
            if (typeof initAppTheme === 'function') initAppTheme();
            window.ProductDebugConsole?.log('productAdd', 'theme-initialized');

            // 2. Initialize Translations (CRITICAL: Load before session and header)
            if (typeof window.loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
                window.ProductDebugConsole?.log('productAdd', 'translations-loaded');
            }

            // 3. Initialize Session (Syncs UI, depends on translations)
            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
                window.ProductDebugConsole?.snapshot('productAdd', 'session-initialized', {
                    hasUserSession: typeof window.userSession !== 'undefined' && !!window.userSession
                });
            }

            // 4. Header Init (Depends on translations)
            if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                await AppHeader.init('header-injection-point', '');
                window.ProductDebugConsole?.log('productAdd', 'header-initialized');
            }



            if (typeof add1_renderCategories === 'function') {
                window.ProductDebugConsole?.log('productAdd', 'render-categories-start');
                await add1_renderCategories();
                window.ProductDebugConsole?.log('productAdd', 'render-categories-complete');

                // 5. Restore draft after categories are ready
                if (typeof ADD1_restoreDraft === 'function') {
                    await ADD1_restoreDraft();
                }

                // 6. Initialize Submit Logic & Listeners (AFTER restoration)
                if (typeof ADD1_initSubmitLogic === 'function') {
                    ADD1_initSubmitLogic();
                }
            }
        });</script></body></html>
