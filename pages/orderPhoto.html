<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صور الطلب - Suez Bazaar</title><script src="/js/app-behavior.js"></script><script src="/js/core-loader-bootstrap.js"></script><style>.orderPh_container{padding:20px;max-width:1200px;margin:0 auto}.orderPh_header{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:25px;padding-bottom:15px;border-bottom:2px solid #e0e0e0;flex-wrap:wrap;gap:15px;box-sizing:border-box}.orderPh_title{color:#333;margin:0;font-size:1.5rem;display:flex;align-items:center;gap:10px}.orderPh_gallery{display:flex;flex-direction:column;gap:20px;width:100%;align-items:center}.orderPh_gallery-item{background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1);overflow:hidden;position:relative;width:100%;display:flex;align-items:center;justify-content:center}.orderPh_gallery-item img{width:100%;height:auto;object-fit:contain;max-height:800px}.orderPh_loader{text-align:center;padding:40px;font-size:1.1rem;color:#666}.orderPh_error-msg{text-align:center;padding:30px;color:#dc3545;background:#fff5f5;border-radius:8px;border:1px solid #ffc9c9;width:100%}@media (max-width:768px){.orderPh_title{font-size:1.25rem}.orderPh_gallery-item img{max-height:500px}}@media (max-width:480px){.orderPh_title{font-size:1.1rem}.orderPh_gallery-item img{max-height:350px}}body.dark-theme .orderPh_title{color:#eee}body.dark-theme .orderPh_header{border-bottom-color:#444}body.dark-theme .orderPh_gallery-item{background:#2d2d2d;box-shadow:0 4px 12px rgba(0,0,0,.3)}body.dark-theme .orderPh_gallery-item img{background-color:#1a1a1a}</style></head><body id="order-photo-page"><div id="header-injection-point"></div><div class="orderPh_container"><div class="orderPh_header"><h2 class="orderPh_title"><i class="fas fa-images" style="color:#007bff"></i> <span data-lkey="order_photo_title">صور الطلب الخاص</span></h2></div><div class="orderPh_gallery" id="orderPh_gallery"></div><div id="orderPh_status" class="orderPh_loader"><i class="fas fa-spinner fa-spin"></i> <span data-lkey="order_photo_searching">جاري البحث عن الصور وتحميلها...</span></div></div><script>/**
         * @file orderPhoto.html
         * @description صفحة عرض صور الطلب الخاص من R2 Bucket
         */

        async function orderPh_main() {
            try {
                const params = new URLSearchParams(window.location.search);
                const u = params.get('u'); // User Key
                const s = params.get('s'); // Merchant Key
                const p = params.get('p'); // Product Key
                const o = params.get('o'); // Order Key

                const gallery = document.getElementById('orderPh_gallery');
                const status = document.getElementById('orderPh_status');

                console.log('[OrderPhoto] Parameters:', { u, s, p, o });

                if (!u || !s || !p || !o) {
                    status.innerHTML = `<div class="orderPh_error-msg">${window.langu('order_photo_incomplete')}</div>`;
                    return;
                }

                const indices = [1, 2, 3, 4];
                const promises = indices.map(i => orderPh_findImage(u, s, p, o, i));

                const results = await Promise.all(promises);
                gallery.innerHTML = '';

                let foundAny = false;
                results.forEach(imgUrl => {
                    if (imgUrl) {
                        foundAny = true;
                        const div = document.createElement('div');
                        div.className = 'orderPh_gallery-item';
                        div.innerHTML = `<img src="${imgUrl}" loading="lazy" alt="Order Photo">`;
                        gallery.appendChild(div);
                    }
                });

                if (!foundAny) {
                    status.innerHTML = `<div class="orderPh_error-msg" style="color:#777;">${window.langu('order_photo_none')}</div>`;
                } else {
                    status.style.display = 'none';
                }

            } catch (error) {
                console.error('[OrderPhoto] Error:', error);
                const status = document.getElementById('orderPh_status');
                if (status) status.innerHTML = `<div class="orderPh_error-msg">${window.langu('order_photo_error')}</div>`;
            }
        }

        function orderPh_findImage(u, s, p, o, index) {
            return new Promise((resolve) => {
                const baseName = `${u}_${s}_${p}_${o}_${index}`;
                const extensions = ['webp', 'jpg', 'png', 'jpeg'];

                const tryNext = (extIdx) => {
                    if (extIdx >= extensions.length) {
                        resolve(null);
                        return;
                    }

                    const ext = extensions[extIdx];
                    const r2PublicUrl = (typeof window.getBazaarInfrastructureConfig === 'function'
                        ? window.getBazaarInfrastructureConfig().r2PublicUrl
                        : null) || '';
                    const url = typeof getPublicR2FileUrl === 'function'
                        ? getPublicR2FileUrl(`${baseName}.${ext}`)
                        : `${r2PublicUrl}/${baseName}.${ext}`;

                    const img = new Image();
                    img.onload = () => resolve(url);
                    img.onerror = () => tryNext(extIdx + 1);
                    img.src = url;
                };

                tryNext(0);
            });
        }

        document.addEventListener('DOMContentLoaded', async function () {
            // 1. Theme
            if (typeof initAppTheme === 'function') initAppTheme();

            // 2. Translations
            if (typeof window.loadIndexTranslations === 'function') {
                await window.loadIndexTranslations();
            }

            // 3. Header
            if (typeof AppHeader !== 'undefined' && AppHeader.init) {
                await AppHeader.init('header-injection-point', '');
            }

            // 4. Session
            if (typeof SessionManager !== 'undefined') {
                SessionManager.init();
            }

            // 5. Run Main
            orderPh_main();
        });</script></body></html>
