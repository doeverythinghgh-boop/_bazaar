<!DOCTYPE html>
<html id="html-root" lang="ar" dir="rtl">

<head id="page-head">
  
  <script src="/LocalDatabasesProject/local-db.js"></script>
  <script src="/js/early-error-bootstrap.js"></script>
  <meta id="meta-charset" charset="UTF-8">
  <meta id="meta-viewport" name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title id="page-title">الفئات - Suez Bazaar</title>

  <!-- Core Loader -->
  <script src="/js/app-behavior.js"></script>
  <script id="core-loader-script" src="/js/core-loader-bootstrap.js"></script>

  <!-- Page Styles -->

  <link id="categories-base-stylesheet" rel="stylesheet" href="/pages/categories/categories-base.css">
  <link id="categories-items-stylesheet" rel="stylesheet" href="/pages/categories/categories-items.css">
  <link id="categories-details-stylesheet" rel="stylesheet" href="/pages/categories/categories-details.css">
  <link id="categories-products-stylesheet" rel="stylesheet" href="/pages/categories/categories-products.css">
  <link id="categories-skeleton-stylesheet" rel="stylesheet" href="/pages/categories/categories-skeleton.css">
  <link id="categories-responsive-stylesheet" rel="stylesheet" href="/pages/categories/categories-responsive.css">
  <link id="categories-dark-stylesheet" rel="stylesheet" href="/pages/categories/categories-dark.css">
  <link id="page-layout-stylesheet" rel="stylesheet" href="/pages/main-category/main-category-layout.css">
  <link id="page-header-stylesheet" rel="stylesheet" href="/pages/main-category/main-category-header.css">
  <link id="page-subcategories-stylesheet" rel="stylesheet" href="/pages/main-category/main-category-subcategories.css">
  <link id="page-gallery-stylesheet" rel="stylesheet" href="/pages/main-category/main-category-gallery.css">
  <link id="page-products-stylesheet" rel="stylesheet" href="/pages/main-category/main-category-products.css">
  <link id="page-utils-stylesheet" rel="stylesheet" href="/pages/main-category/main-category-utils.css">
  <link id="page-merchants-stylesheet" rel="stylesheet" href="/pages/main-category/main-category-merchants.css">


  <script id="tools-text" src="/js/tools-text.js" defer></script>
  <script id="main-category-api" src="/pages/main-category/main-category-api.js" defer></script>
  <script id="main-category-ui-utils" src="/pages/main-category/main-category-ui-utils.js" defer></script>
  <script id="main-category-ui-header" src="/pages/main-category/main-category-ui-header.js" defer></script>
  <script id="main-category-ui-subcategories" src="/pages/main-category/main-category-ui-subcategories.js" defer></script>
  <script id="main-category-ui-products" src="/pages/main-category/main-category-ui-products.js" defer></script>
  <script id="main-category-ui-merchants" src="/pages/main-category/main-category-ui-merchants.js" defer></script>
  <script id="main-category-events" src="/pages/main-category/main-category-events.js" defer></script>
  <script id="main-category-init" src="/pages/main-category/main-category-init.js" defer></script>
</head>

<body id="page-body" style="background-color: var(--bg-color-light);">

  <!-- Header Container -->
  <div id="header-injection-point"></div>

  <div id="main-category-page" class="main-category-page">
    <header id="main-category-header-card" class="main-category-header-card" style="display: none;">
      <div id="main-category-icon-box" class="main-category-icon-box">
        <i id="main-category-icon" class="fas fa-layer-group"></i>
      </div>
      <div id="main-category-title-group" class="main-category-title-group">
        <h3 id="main-category-title">...</h3>
        <p id="main-category-subtitle">...</p>
        <div class="main-category-search-container" id="main-category-search-container" style="position: relative; margin-top: 10px; width: 100%; display: none;">
          <input type="text" id="main-category-search-input" class="main-category-search-input" placeholder="🔍 بحث..." autocomplete="off" style="width: 100%; padding: 8px 35px 8px 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color-white); font-family: inherit; font-size: 0.95rem; outline: none; box-sizing: border-box; color: var(--text-color);">
          <i id="main-category-search-clear" class="fas fa-times-circle" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-color-light); font-size: 1rem; cursor: pointer; display: none;"></i>
        </div>
      </div>
    </header>

    <div id="main-category-subcategories" class="main-category-subcategories"></div>

    <div id="main-category-gallery" class="main-category-gallery">
      <div id="main-category-gallery-content" class="main-category-gallery-content"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      // 1. Initialize Theme (Dark Mode support)
      if (typeof initAppTheme === 'function') {
        window.initAppTheme();
      }

      // 2. Initialize Translations (CRITICAL: Load before session and header)
      if (typeof loadIndexTranslations === 'function') {
        await window.loadIndexTranslations();
      }

      // 3. Initialize Session (Syncs UI, depends on translations)
      if (typeof SessionManager !== 'undefined') {
        SessionManager.init();
      }

      // 4. Load Core Data
      if (typeof fetchAppCategories === 'function') {
        await fetchAppCategories();
      }

      // 5. Initialize Header (Depends on translations).
      // Pass an empty string as the active button ID: main-category is a sub-page
      // reachable from home, but it is NOT home itself, so 'index-home-btn' must NOT
      // be highlighted here.
      if (typeof AppHeader !== 'undefined' && AppHeader.init) {
        await AppHeader.init('header-injection-point', '');
      }

      if (typeof applyAppTranslations === 'function') {
        window.applyAppTranslations();
      }
    });
  </script>
</body>

</html>
