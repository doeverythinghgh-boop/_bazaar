<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>الفئات - Suez Bazaar</title><script src="/js/core-loader.js"></script><link rel="stylesheet" href="/pages/main-category/main-category.css"><script src="/pages/main-category/main-category.js" defer="defer"></script></head><body style="background-color:var(--bg-color-light)"><div id="header-injection-point"></div><div id="main-category-page" class="main-category-page"><div class="main-category-header"><div class="main-category-title-wrap"><h2 id="main-category-title" class="main-category-title">...</h2><p id="main-category-subtitle" class="main-category-subtitle" data-lkey="cat_select_sub_placeholder">اختر فئة فرعية</p></div></div><div id="main-category-subcategories" class="main-category-subcategories"></div><div id="main-category-gallery" class="main-category-gallery"><div class="main-category-gallery__header"><h3 class="main-category-gallery__title" data-lkey="featured_products_title">المنتجات</h3><div class="main-category-gallery__actions"><button id="main-category-view-all-btn" class="main-category-view-all-btn" type="button" style="display:none"><i class="fas fa-external-link-alt" style="margin-left:5px"></i> <span data-lkey="cat_view_all_btn">عرض الكل</span></button> <button id="main-category-view-toggle" class="main-category-view-toggle" type="button" data-lkey-title="cat_view_toggle_title" style="display:none"><i class="fas fa-list"></i></button></div></div><div id="main-category-gallery-content" class="main-category-gallery-content"></div></div></div><script>document.addEventListener('DOMContentLoaded', async function () {
      // 1. Initialize Theme (Dark Mode support)
      if (typeof initAppTheme === 'function') {
        window.initAppTheme();
      }

      // 2. Initialize Translations (CRITICAL: Load before session and header)
      if (typeof loadIndexTranslations === 'function') {
        await window.loadIndexTranslations();
      }

      // 3. Initialize Session (Syncs UI, depends on translations)
      if (typeof SessionManager !== 'undefined') {
        SessionManager.init();
      }

      // 4. Load Core Data
      if (typeof fetchAppCategories === 'function') {
        await fetchAppCategories();
      }

      // 5. Initialize Header (Depends on translations)
      if (typeof AppHeader !== 'undefined' && AppHeader.init) {
        await AppHeader.init('header-injection-point', 'index-home-btn');
      }

      if (typeof applyAppTranslations === 'function') {
        window.applyAppTranslations();
      }
    });</script></body></html>
