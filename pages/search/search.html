earch" id="search-modal-input" data-lkey-placeholder="search_modal_input_placeholder" placeholder="ابحث عن منتج أو خدمة..." autocomplete="off"></div></td></tr><tr id="search-action-row"><td id="search-sort-cell"><div id="search-sort-filter-group" class="search-filter-group"><i id="search-sort-filter-icon" class="fas fa-sort-amount-down search-filter-icon"></i> <select id="search-sort-filter" class="search-category-filter" data-lkey-title="search_modal_sort_label" aria-label="ترتيب حسب"><option id="search-sort-default" value="default" data-lkey="search_modal_sort_default">الترتيب الافتراضي</option><option id="search-sort-price-asc" value="price-asc" data-lkey="search_modal_sort_price_asc">الأقل سعراً</option><option id="search-sort-price-desc" value="price-desc" data-lkey="search_modal_sort_price_desc">الأعلى سعراً</option></select></div></td><td id="search-button-cell"><button id="search-perform-search-btn" class="search-button" data-lkey-title="search_modal_search_btn_aria" aria-label="بحث" style="width:100%;height:50px;border-radius:50px"><i id="search-button-icon" class="fas fa-search"></i></button></td></tr></tbody></table><div id="search-results-container"></div></div><script>document.addEventListener('DOMContentLoaded', async function () {
      // 1. Initialize Theme
      if (typeof initAppTheme === 'function') initAppTheme();

      // 2. Initialize Translations (CRITICAL: Load before session and header)
      if (typeof loadIndexTranslations === 'function') {
        await window.loadIndexTranslations();
      }

      // 3. Initialize Session (Syncs UI, depends on translations)
      if (typeof SessionManager !== 'undefined') {
        SessionManager.init();
      }

      // 4. Load Core Data
      if (typeof fetchAppCategories === 'function') await fetchAppCategories();

      // 5. Initialize Header (Depends on translations)
      if (typeof AppHeader !== 'undefined' && AppHeader.init) {
        await AppHeader.init('header-injection-point', 'index-search-btn');
      }

      // 6. Initialize Page Logic
      if (typeof initSearchModal === 'function') {
        initSearchModal();
      }

      
    });</script></body></html>
