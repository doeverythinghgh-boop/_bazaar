<!DOCTYPE html>
<html id="index-html-root" lang="ar" dir="rtl">

<head>
  
  <script src="/LocalDatabasesProject/local-db.js"></script>
  <script src="/js/early-error-bootstrap.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>البحث - Suez Bazaar</title>

  <!-- Core Loader -->
  <script src="/js/app-behavior.js"></script>
  <script src="/js/core-loader-bootstrap.js"></script>

  <!-- Page Styles -->
  <!-- Page Styles (Modular) -->
  <link rel="stylesheet" href="/pages/search/css/search-animations.css">
  <link rel="stylesheet" href="/pages/search/css/search-base.css">
  <link rel="stylesheet" href="/pages/search/css/search-filters.css">
  <link rel="stylesheet" href="/pages/search/css/search-results-general.css">
  <link rel="stylesheet" href="/pages/search/css/search-results-item.css">
  <link rel="stylesheet" href="/pages/search/css/search-results-mgmt.css">
  <link rel="stylesheet" href="/pages/search/css/search-results-empty.css">
  <link rel="stylesheet" href="/pages/search/css/search-results-badges.css">
  <link rel="stylesheet" href="/pages/search/css/search-results-load-more.css">
  <link rel="stylesheet" href="/pages/search/css/search-responsive.css">
  <link id="port-link-featured-css" rel="stylesheet" href="/pages/merchant-portfolio/css/portfolio-featured.css">



  <!-- Page Specific Scripts -->
  <!-- Page Specific Scripts (Modular) -->
  <script src="/pages/search/js/search-config.js" defer></script>
  <script src="/pages/search/js/search-utils.js" defer></script>
  <script src="/pages/search/js/search-admin.js" defer></script>
  <script src="/pages/search/js/search-render-badges.js" defer></script>
  <script src="/pages/search/js/search-render-cards.js" defer></script>
  <script src="/pages/search/js/search-render-mgmt.js" defer></script>
  <script src="/pages/search/js/search-render-main.js" defer></script>
  <script src="/pages/search/js/search-api.js" defer></script>
  <script src="/pages/search/js/search-state.js" defer></script>
  <script src="/pages/search/js/search-flow.js" defer></script>
  <script src="/pages/search/js/search-filters.js" defer></script>
  <script src="/pages/search/js/search-pending.js" defer></script>

  <script src="/pages/merchant-portfolio/js/portfolio-featured-state.js"></script>
  <script src="/pages/merchant-portfolio/js/portfolio-featured-actions.js"></script>
  <script src="/pages/merchant-portfolio/js/portfolio-featured-render.js"></script>
  <script src="/pages/merchant-portfolio/js/portfolio-featured-scroll.js"></script>
  <script src="/pages/search/js/search-init.js" defer></script>
</head>

<body style="background-color: var(--bg-color-light);">


  <!-- Header Container -->
  <div id="header-injection-point"></div>

  <div id="search-modal-content" class="search-modal-content">
    <div id="search-layout" class="search-layout">

      <!-- Section 1: Filter Icons Row -->
      <div id="search-filters-section" class="search-filters-section">
        <div id="search-quick-actions-row" class="search-quick-actions-row">

          <!-- Search Mode -->
          <div id="search-mode-trigger" class="search-icon-trigger" data-lkey-title="search_mode_label">
            <i class="fas fa-sliders-h search-action-icon"></i>
            <span id="search-mode-display" class="search-action-text" data-lkey="search_mode_label">نوع البحث</span>
          </div>

          <!-- Main Category -->
          <div id="search-main-category-trigger" class="search-icon-trigger"
            data-lkey-title="search_modal_main_category_label">
            <i class="fas fa-cubes search-action-icon"></i>
            <span id="search-main-category-display" class="search-action-text"
              data-lkey="search_modal_main_category_label">الرئيسي</span>
          </div>

          <!-- Sub Category -->
          <div id="search-sub-category-filter-group" class="search-icon-trigger-wrapper">
            <div id="search-sub-category-trigger" class="search-icon-trigger disabled"
              data-lkey-title="search_modal_sub_category_label">
              <i class="fas fa-cube search-action-icon"></i>
              <span id="search-sub-category-display" class="search-action-text"
                data-lkey="search_modal_sub_category_label">الفرعي</span>
            </div>
          </div>

          <!-- Search Text Query -->
          <div id="search-text-trigger" class="search-icon-trigger">
            <i class="fas fa-font search-action-icon"></i>
            <span id="search-text-display" class="search-action-text"
              data-lkey="search_modal_input_placeholder">نص</span>
          </div>

          <!-- Sort Order -->
          <div id="search-sort-trigger" class="search-icon-trigger" data-lkey-title="search_modal_sort_label">
            <i class="fas fa-sort-amount-down-alt search-action-icon"></i>
            <span id="search-sort-display" class="search-action-text" data-lkey="search_modal_sort_label">الترتيب</span>
          </div>

          <!-- Hidden input to maintain JS logic -->
          <input type="hidden" id="search-modal-input" value="">
        </div>
      </div>

      <!-- Section 2: Search Action Button -->
      <div id="search-action-section" class="search-action-section">
        <button id="search-perform-search-btn" class="search-button" data-lkey-title="search_modal_search_btn_aria"
          aria-label="بحث">
          <i id="search-button-icon" class="fas fa-search"></i>
        </button>
      </div>

    </div><!-- /#search-layout -->

    <div id="search-results-container"></div>
  </div><!-- /#search-modal-content -->

  <script>
    document.addEventListener('DOMContentLoaded', async function () {
      console.log('%c [Search Module - HTML] DOMContentLoaded Start', 'color: blue; font-weight: bold;');
      // 1. Initialize Theme
      if (typeof initAppTheme === 'function') {
        console.info('%c [Search Module - HTML] Executing initAppTheme', 'color: blue; font-weight: bold;');
        initAppTheme();
      }

      // 2. Initialize Translations (CRITICAL: Load before session and header)
      if (typeof loadIndexTranslations === 'function') {
        console.info('%c [Search Module - HTML] Executing loadIndexTranslations', 'color: blue; font-weight: bold;');
        await window.loadIndexTranslations();
      }

      // 3. Initialize Session (Syncs UI, depends on translations)
      if (typeof SessionManager !== 'undefined') {
        console.info('%c [Search Module - HTML] Executing SessionManager.init()', 'color: blue; font-weight: bold;');
        SessionManager.init();
      }

      // 4. Load Core Data
      if (typeof fetchAppCategories === 'function') {
        console.info('%c [Search Module - HTML] Executing fetchAppCategories()', 'color: blue; font-weight: bold;');
        await fetchAppCategories();
      }

      // 5. Initialize Header (Depends on translations)
      if (typeof AppHeader !== 'undefined' && AppHeader.init) {
        console.info('%c [Search Module - HTML] Executing AppHeader.init()', 'color: blue; font-weight: bold;');
        await AppHeader.init('header-injection-point', 'index-search-btn');
      }

      // 6. Initialize Page Logic
      if (typeof initSearchModal === 'function') {
        console.info('%c [Search Module - HTML] Executing initSearchModal()', 'color: blue; font-weight: bold;');
        initSearchModal();
      }

      console.log('%c [Search Module - HTML] DOMContentLoaded End', 'color: blue; font-weight: bold;');
    });
  </script>
</body>

</html>
